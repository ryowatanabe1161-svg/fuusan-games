<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0f1e">
<title>幻獣デュエル ～ネオ・アリーナ～</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#05070f;color:#eef;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
:root{--cw:min(21vw,9.6vh,92px);--hw:min(19vw,10.5vh,92px)}
@supports(height:1dvh){:root{--cw:min(21vw,9.6dvh,92px);--hw:min(19vw,10.5dvh,92px)}}
#app{position:relative;max-width:470px;margin:0 auto;height:100vh;height:100dvh;overflow:hidden;background:radial-gradient(ellipse at 50% 50%,#1b2350 0%,#0b0f24 60%,#05070f 100%);box-shadow:0 0 40px #000}
.hidden{display:none!important}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer;border:none}
/* ---------- title ---------- */
#title{align-items:center;justify-content:safe center;gap:10px;overflow-y:auto;padding:24px;text-align:center;background:radial-gradient(circle at 50% 35%,#3a2a7a 0%,#141a3c 45%,#05070f 100%)}
.emblem{width:min(96px,11vh);height:min(96px,11vh);flex:0 0 auto;position:relative;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.logo{font-size:34px;font-weight:900;letter-spacing:2px;background:linear-gradient(#fff6c8,#ffb52e 55%,#c55a00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #3a1500) drop-shadow(0 0 12px #ff9a2a88)}
.sublogo{font-size:15px;color:#cfd6ff;letter-spacing:4px;margin-top:-10px}
.bigbtn{min-width:240px;padding:16px 24px;border-radius:14px;font-size:20px;font-weight:800;color:#2a1600;background:linear-gradient(#ffe68a,#ffae2e);box-shadow:0 5px 0 #a35a00,0 0 20px #ffb22e66;letter-spacing:2px}
.bigbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #a35a00}
.subbtn{min-width:200px;padding:12px 20px;border-radius:12px;font-size:16px;font-weight:700;color:#dfe5ff;background:#28305e;border:1px solid #5664b0}
.credit{font-size:11px;color:#7b84b8;margin-top:6px}
/* ---------- game ---------- */
#game{padding:4px 6px calc(4px + env(safe-area-inset-bottom));gap:3px}
.lpbar{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:10px;background:linear-gradient(90deg,#141a3a,#1f2858);border:1px solid #3a4590;min-height:40px;position:relative}
.lpbar.cpu{background:linear-gradient(90deg,#3a1420,#1f1630);border-color:#8a3a50}
.who{font-size:12px;font-weight:800;white-space:nowrap}
.lpbox{flex:1;position:relative}
.lpnum{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:1px;line-height:1}
.lpnum small{font-size:11px;color:#aab;margin-right:3px}
.lpgauge{height:6px;border-radius:3px;background:#0006;margin-top:3px;overflow:hidden}
.lpgauge i{display:block;height:100%;background:linear-gradient(90deg,#3cf08a,#c8ff5a);transition:width .6s}
.lpgauge.low i{background:linear-gradient(90deg,#ff4a4a,#ffa040)}
.cpuhand{display:flex;gap:2px;align-items:center}
.minib{width:12px;height:17px;border-radius:2px;background:linear-gradient(135deg,#6b3a1a,#2a1408);border:1px solid #c9883a}
.iconbtn{width:38px;height:34px;border-radius:9px;background:#2a3468;color:#fff;font-size:15px;font-weight:800;border:1px solid #4f5db0}
#field{flex:1;display:flex;flex-direction:column;justify-content:center;gap:4px;min-height:0}
.row{display:grid;grid-template-columns:repeat(4,var(--cw));gap:6px;justify-content:center;align-items:center}
.zone{position:relative;width:var(--cw);height:calc(var(--cw)*1.43);border-radius:7px;display:flex;align-items:center;justify-content:center;--w:var(--cw)}
.zone.mz{background:rgba(255,160,60,.07);border:1px dashed rgba(255,170,80,.35)}
.zone.sz{background:rgba(80,220,180,.06);border:1px dashed rgba(120,220,200,.3)}
.zone.pile{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.12)}
.inner{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.empty{font-size:10px;color:rgba(255,255,255,.22);font-weight:700}
.pilelbl{position:absolute;bottom:-1px;left:0;right:0;text-align:center;font-size:10px;font-weight:800;background:#000a;border-radius:0 0 6px 6px;padding:1px 0;z-index:3}
.chip{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:900;padding:1px 6px;border-radius:8px;z-index:4;white-space:nowrap;font-variant-numeric:tabular-nums;box-shadow:0 1px 3px #000}
.chip.a{background:#b3161f;color:#fff}.chip.d{background:#1650b3;color:#fff}.chip.up{background:#e0860e}
.zone.selectable{border:2px solid #5ff;box-shadow:0 0 14px #5ff;animation:pulse 1s infinite}
.zone.chosen{border:2px solid #ff5;box-shadow:0 0 18px #ff5}
@keyframes pulse{50%{box-shadow:0 0 4px #5ff}}
.zone.ready .inner>.card{box-shadow:0 0 0 2px #ff3b3b,0 0 12px #ff3b3b}
#mid{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:2px 2px;min-height:46px}
.phases{display:flex;gap:3px}
.ph{font-size:11px;font-weight:800;padding:5px 6px;border-radius:6px;background:#1a2048;color:#7480c0;border:1px solid #2c3670}
.ph.on{background:linear-gradient(#ffe27a,#f0a020);color:#3a1d00;border-color:#fff3}
.ph.on.c{background:linear-gradient(#ff8a9a,#c02040);color:#fff}
.turninfo{font-size:11px;color:#b8c0f0;text-align:center;line-height:1.2;flex:1}
.turninfo b{display:block;font-size:13px;color:#fff}
.actbtns{display:flex;gap:5px}
.pbtn{height:42px;min-width:64px;padding:0 10px;border-radius:10px;font-size:14px;font-weight:800;color:#fff;background:linear-gradient(#e2453c,#a3171a);box-shadow:0 3px 0 #5a0a0c}
.pbtn.end{background:linear-gradient(#4a63e0,#2836a0);box-shadow:0 3px 0 #141c5a}
.pbtn:active{transform:translateY(2px);box-shadow:none}
.pbtn:disabled{opacity:.35}
#hand{display:flex;gap:5px;overflow-x:auto;overflow-y:visible;padding:8px 4px 6px;min-height:calc(var(--hw)*1.43 + 14px);align-items:flex-end;scrollbar-width:none}
#hand::-webkit-scrollbar{display:none}
.hcard{flex:0 0 auto;--w:var(--hw);transition:transform .15s}
.hcard.can .card{box-shadow:0 0 0 2px #5ff,0 0 10px #5ffa}
.hcard:active{transform:translateY(-6px)}
#ticker{font-size:12px;padding:5px 10px;background:#0009;border-radius:8px;border:1px solid #2a3260;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:26px;color:#dde}
#ticker::before{content:"📜 ";}
/* ---------- card ---------- */
.card{position:relative;width:var(--w);height:calc(var(--w)*1.43);border-radius:calc(var(--w)*.06);font-size:calc(var(--w)*.105);padding:.35em;display:flex;flex-direction:column;gap:.2em;color:#1a0d00;box-shadow:0 2px 5px #0008;overflow:hidden;flex:0 0 auto}
.card.mon{background:linear-gradient(160deg,#f7e08a,#dcb446 60%,#b98c22);border:.18em solid #6a4c06}
.card.eff{background:linear-gradient(160deg,#f7a865,#de6a22 60%,#b04a10);border:.18em solid #5a2204}
.card.spell{background:linear-gradient(160deg,#4fd1a5,#16906c 60%,#0c6a4f);border:.18em solid #063d2c}
.card.trap{background:linear-gradient(160deg,#e07ac4,#a33b8c 60%,#7a2068);border:.18em solid #430c39}
.card.def{transform:rotate(-90deg) scale(.7)}
.card.god{background:linear-gradient(160deg,#fff6c0,#f2c230 30%,#d08a10 60%,#fff0a0 85%,#c07a00);border:.2em solid #6a4400;box-shadow:0 0 .6em #ffd84a,0 0 1.4em #ff9a2a88,0 2px 5px #0008}
.card.god::before{content:"";position:absolute;inset:-50%;background:conic-gradient(#ff4a4a55,#ffd84a55,#4aff8a55,#4ac8ff55,#c84aff55,#ff4a4a55);animation:spin 4s linear infinite;z-index:0;pointer-events:none;mix-blend-mode:overlay}
.card.god>*{position:relative;z-index:1}
.card.god .attr{position:absolute}
.card.ritual{background:linear-gradient(160deg,#9fd0ff,#3c7fd8 60%,#1c4a9a);border:.18em solid #0a2458}
.semi{position:absolute;bottom:18%;left:2px;z-index:3;background:#e07a10;color:#fff;font-size:10px;font-weight:900;padding:0 4px;border-radius:5px;box-shadow:0 1px 2px #000}
.card.fusion{background:linear-gradient(160deg,#c9a6ff,#8a52d8 60%,#5a2aa8);border:.18em solid #2a0f5a}
.card.fusion .cname{background:linear-gradient(#f4ecff,#dccbff)}
.card.dragonw .art{box-shadow:inset 0 0 .8em #7fe0ff}
@keyframes spin{to{transform:rotate(360deg)}}
.art svg{width:92%;height:92%;filter:drop-shadow(0 .08em .12em #0008)}
.flash.god{background:radial-gradient(circle,#fff8 0%,#ffcc3a55 30%,#000c 75%)}
.flash.god .lbl{font-size:34px;letter-spacing:8px;color:#fff6c0;text-shadow:0 0 6px #ff9a00,0 0 14px #ff5a00,0 2px 0 #7a3a00}
.rays{position:absolute;inset:-60%;background:repeating-conic-gradient(#fff6 0 6deg,#0000 6deg 18deg);animation:spin 3s linear infinite;pointer-events:none}
.decksel{display:flex;flex-direction:column;gap:5px;width:100%;max-width:360px}
.decksel .lbl{font-size:12px;color:#aab3e8;text-align:left}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{min-height:40px;border-radius:10px;font-size:11.5px;line-height:1.2;font-weight:800;background:#1e2550;color:#c8d0ff;border:1px solid #3f4a90;padding:4px 3px}
.chips button.on{background:linear-gradient(#ffe68a,#ffae2e);color:#2a1600;border-color:#fff6}
.zukan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;--w:100%}
.zukan>div{cursor:pointer}
.zukan .card{width:100%;height:auto;aspect-ratio:1/1.43;font-size:min(2.9vw,11px)}
.ztabs{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.ztabs button{padding:6px 10px;border-radius:8px;font-size:12px;font-weight:800;background:#1e2550;color:#c8d0ff;border:1px solid #3f4a90}
.ztabs button.on{background:#ffd24a;color:#2a1600}
.cname{font-weight:900;font-size:.95em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:linear-gradient(#fffbe8,#efe0b0);border-radius:.2em;padding:.05em .25em;padding-right:1.5em;border:.08em solid #0005}
.spell .cname,.trap .cname{padding-right:.25em}
.attr{position:absolute;top:.4em;right:.4em;width:1.35em;height:1.35em;border-radius:50%;color:#fff;font-size:.9em;font-weight:900;display:flex;align-items:center;justify-content:center;border:.08em solid #fff8;line-height:1}
.stars{color:#ffef3a;font-size:.72em;text-align:right;line-height:1;letter-spacing:-.05em;text-shadow:0 0 .2em #c40,0 0 .1em #000;white-space:nowrap;overflow:hidden;min-height:1em}
.stype{font-size:.72em;font-weight:900;text-align:right;line-height:1;color:#fff;text-shadow:0 0 .2em #000}
.art{flex:1;border:.12em solid #3a2006;border-radius:.15em;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:0;position:relative}
.art span{font-size:3.3em;line-height:1;filter:drop-shadow(0 .08em .1em #0009)}
.art::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#fff4 0%,transparent 35%,transparent 70%,#0003 100%)}
.stats{font-size:.82em;font-weight:900;text-align:right;line-height:1.1;background:#fff7e0cc;border-radius:.2em;padding:.05em .25em;white-space:nowrap;font-variant-numeric:tabular-nums}
.stats .up{color:#c03000}
.ctext{display:none}
.card.big .ctext{display:block;font-size:.62em;line-height:1.45;background:#fff8e6;border-radius:.2em;padding:.4em .5em;min-height:5.5em;border:.08em solid #0004;color:#221}
.card.big .art span{font-size:4.2em}
.card.big .stars{font-size:.85em}
.card.setown .art,.card.setown .cname{filter:brightness(.55) saturate(.6)}
.setbadge{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%) rotate(-12deg);background:#000c;color:#ffd;font-weight:900;font-size:.9em;padding:.1em .45em;border-radius:.3em;border:.08em solid #ffd8;white-space:nowrap}
.card.back{background:radial-gradient(circle at 50% 50%,#d8822e 0%,#7a3a12 25%,#3a1806 55%,#1a0a02 100%);border:.18em solid #2a1203;padding:.4em}
.backin{width:100%;height:100%;border:.12em solid #e0a050;border-radius:.3em;display:flex;align-items:center;justify-content:center;background:repeating-conic-gradient(from 0deg,#0000 0 15deg,#ffb2400f 15deg 30deg)}
.backin span{font-size:2.6em;color:#ffcf6a;text-shadow:0 0 .3em #ff7a00}
/* ---------- modal ---------- */
#modal{position:absolute;inset:0;z-index:100;background:rgba(3,5,15,.82);display:flex;align-items:center;justify-content:center;padding:14px;backdrop-filter:blur(2px)}
.mbox{width:100%;max-width:380px;max-height:92%;overflow-y:auto;background:linear-gradient(#1c2350,#121735);border:1px solid #4a56a8;border-radius:16px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:10px;animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.mbox h3{font-size:17px;text-align:center}
.mbox p{font-size:14px;line-height:1.6;color:#dde}
.acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%}
.abtn{flex:1 1 40%;min-height:50px;border-radius:12px;font-size:17px;font-weight:900;color:#2a1600;background:linear-gradient(#ffe68a,#ffae2e);box-shadow:0 3px 0 #a35a00}
.abtn.red{background:linear-gradient(#ff7a6a,#d02a2a);color:#fff;box-shadow:0 3px 0 #6a0a0a}
.abtn.blue{background:linear-gradient(#7a9aff,#3a52d0);color:#fff;box-shadow:0 3px 0 #18206a}
.abtn.gray{background:#3a4270;color:#dde;box-shadow:0 3px 0 #1a1f40}
.abtn:disabled{opacity:.33;filter:grayscale(1)}
.hint{font-size:12px;color:#a8b0e0;text-align:center}
.loglist{width:100%;font-size:13px;line-height:1.55;max-height:60vh;overflow-y:auto;display:flex;flex-direction:column-reverse}
.loglist div{padding:3px 4px;border-bottom:1px solid #ffffff12}
.loglist div.p0{color:#bcd6ff}.loglist div.p1{color:#ffc4cc}.loglist div.sys{color:#ffe08a}
.gylist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;--w:70px}
.rules{font-size:13.5px;line-height:1.7;width:100%}
.rules li{margin-left:1.2em}
/* ---------- selection bar ---------- */
#selbar{position:absolute;left:8px;right:8px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:60;background:#0b1030f0;border:2px solid #5ff;border-radius:14px;padding:10px;display:flex;align-items:center;gap:8px;box-shadow:0 0 20px #5ff6}
#selbar .t{flex:1;font-size:14px;font-weight:800}
#selbar button{height:46px;padding:0 14px;border-radius:10px;font-weight:900;font-size:15px;background:#3a4270;color:#fff}
/* ---------- fx ---------- */
#banner{position:absolute;left:0;right:0;top:42%;z-index:90;text-align:center;pointer-events:none;opacity:0}
#banner div{display:inline-block;font-size:26px;font-weight:900;padding:10px 30px;background:linear-gradient(90deg,#0000,#000c 20%,#000c 80%,#0000);color:#ffe27a;text-shadow:0 0 10px #f80;letter-spacing:3px;width:100%}
#banner.c div{color:#ff9aaa;text-shadow:0 0 10px #f04}
.flash{position:absolute;inset:0;z-index:95;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#000a;pointer-events:none;--w:min(52vw,190px)}
.flash .lbl{font-size:24px;font-weight:900;color:#fff;text-shadow:0 0 12px #5ff,0 0 4px #000}
.boom{position:absolute;z-index:80;pointer-events:none;font-size:44px;transform:translate(-50%,-50%)}
.dmg{position:absolute;z-index:85;pointer-events:none;font-size:28px;font-weight:900;color:#ff3b3b;text-shadow:0 0 6px #000,0 0 2px #000;transform:translate(-50%,-50%);white-space:nowrap}
.dmg.heal{color:#5aff8a}
/* ---------- result ---------- */
#result{align-items:center;justify-content:center;gap:18px;z-index:120;background:rgba(3,5,15,.9);text-align:center;padding:20px}
.restitle{font-size:56px;font-weight:900;letter-spacing:6px}
.restitle.win{background:linear-gradient(#fff6c8,#ffb52e);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 16px #fa0)}
.restitle.lose{color:#8a93c8;filter:drop-shadow(0 0 10px #46f)}
.resmsg{font-size:15px;color:#cdd;line-height:1.7}
@media (min-width:600px){#app{border-left:1px solid #2a3060;border-right:1px solid #2a3060}}
#cover{position:absolute;inset:0;z-index:130;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;cursor:pointer}
#cover.p0{background:radial-gradient(circle at 50% 40%,#2a4aa8,#0b1430 70%)}
#cover.p1{background:radial-gradient(circle at 50% 40%,#a82a4a,#300b14 70%)}
.cv-ic{font-size:64px;animation:float 2s ease-in-out infinite}
.cv-t{font-size:26px;font-weight:900;color:#fff3b0;text-shadow:0 2px 0 #0008}
.cv-s{font-size:15px;color:#e0e4ff}
.cv-tap{margin-top:18px;padding:16px 34px;border-radius:14px;background:linear-gradient(#ffe68a,#ffae2e);color:#2a1600;font-weight:900;font-size:19px;box-shadow:0 5px 0 #a35a00;animation:pulse 1.2s infinite}
.cv-n{font-size:12px;color:#ffffffa0;margin-top:10px}
.chip.q{background:#7a4ad0;font-size:10px}.chip.f{background:#14866a;font-size:10px}.chip.t{background:#b0308e;font-size:10px;color:#fff}
.chip.st{bottom:auto;top:-4px;background:#e07a00;color:#fff;font-size:10px}
.chip.ct{bottom:auto;top:-4px;left:18%;background:#2a7de1;color:#fff;font-size:10px}
.banlbl{position:absolute;top:-6px;right:-4px;z-index:5;background:#5a2a8a;color:#fff;font-size:10px;font-weight:900;padding:1px 5px;border-radius:7px;box-shadow:0 1px 3px #000}
.zk{position:relative}.lim{position:absolute;bottom:18%;left:2px;z-index:3;background:#d01030;color:#fff;font-size:10px;font-weight:900;padding:0 4px;border-radius:5px;box-shadow:0 1px 2px #000}
.era{position:absolute;bottom:18%;right:2px;z-index:3;background:#222c;color:#ffd76a;font-size:9px;font-weight:900;padding:0 3px;border-radius:4px}
.chips{display:grid;grid-template-columns:repeat(4,1fr)}
.chips.two{grid-template-columns:1fr 1fr}
.restitle.pvp{font-size:40px;letter-spacing:2px;line-height:1.2}
.ztabs small{margin-left:3px;opacity:.7;font-size:10px}
#lobby{align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:radial-gradient(circle at 50% 35%,#2a3a7a 0%,#141a3c 45%,#05070f 100%);z-index:20}
.lbox{display:flex;flex-direction:column;gap:12px;align-items:center;width:100%;max-width:340px;padding:16px;border-radius:16px;background:#141a3ccc;border:1px solid #3f4a90}
.roomcode{font-size:44px;font-weight:900;letter-spacing:8px;color:#ffe27a;font-family:ui-monospace,Menlo,Consolas,monospace;text-shadow:0 0 12px #f80;user-select:all;-webkit-user-select:all}
.codeinput{width:100%;font-size:32px;font-weight:900;letter-spacing:8px;text-align:center;padding:10px;border-radius:12px;border:2px solid #5664b0;background:#0b0f24;color:#ffe27a;font-family:ui-monospace,Menlo,Consolas,monospace;text-transform:uppercase}
.netstatus{font-size:14px;color:#cfd6ff;white-space:pre-line;min-height:40px}
.netstatus.ok{color:#7dffa8}.netstatus.err{color:#ff8a8a}
.bigbtn:disabled{opacity:.45}
#waitbar{position:absolute;top:48px;left:50%;transform:translateX(-50%);z-index:92;background:#000d;border:1px solid #ffd24a;color:#ffe27a;font-weight:800;font-size:14px;padding:8px 16px;border-radius:20px;pointer-events:none;white-space:nowrap;animation:pulse 1.2s infinite}
.chips.three{grid-template-columns:1fr 1fr 1fr}
</style>
</head>
<body>
<div id="app">
  <section id="title" class="screen">
    <svg class="emblem" viewBox="0 0 100 100" aria-hidden="true">
      <defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe98a"/><stop offset="1" stop-color="#d06a10"/></linearGradient>
      <radialGradient id="g2"><stop offset="0" stop-color="#b98cff"/><stop offset="1" stop-color="#2a0f6a"/></radialGradient></defs>
      <polygon points="50,3 61,36 96,36 68,57 79,92 50,71 21,92 32,57 4,36 39,36" fill="url(#g1)" stroke="#5a2800" stroke-width="2"/>

  for(const st of O.sz)if(st&&st.faceUp&&st.card.effect==='mirage'&&!G.over){const n=Math.max(0,4-O.hand.length);if(n>0&&O.deck.length>=n){log(`「${st.card.name}」の効果。`,'p'+(1-p));drawCards(1-p,n);st.mirN=(st.mirN||0)+n;}}
  for(let k=0;k<3;k++){const st=P.sz[k];if(!st||!st.faceUp||G.over)continue;
    if(st.card.effect==='mirage'&&st.mirN>0){const n=st.mirN;st.mirN=0;log(`「${st.card.name}」の効果で手札を${n}枚ランダムに捨てる。`,'p'+p);for(let j=0;j<n&&P.hand.length;j++)await discardFrom(p,Math.floor(Math.random()*P.hand.length),'ランダムに');}
    if(st.card.effect==='messenger'){if(P.lp>100)await payLP(p,100);else await destroyST(p,k);}}
}
async function startTurn(p){
  if(G.over)return;
  G.turn++;G.cur=p;G.normalSummoned=false;G.extraNS=0;G.noNS=null;G.phase='draw';G.busy=true;G.battleOver=false;G.battleMod=null;
  if(G.mode==='pvp'){await handover(p,`${N(p)}に渡してください`,`ターン${G.turn}：${N(p)}のターンです`);G.view=p;}
  log(`── ターン${G.turn}：${N(p)}のターン ──`);
  render();
  await banner(`${N(p)}のターン`,G.mode==='cpu'?p===1:p===1);
  if(G.turn>1){if(G.skipDraw&&G.skipDraw[p]>0){G.skipDraw[p]--;log(`${N(p)}は効果によりこのドローフェイズにドローできない！`,'p'+p);}else if(!drawCards(p,1))return;}
  else log(`先攻1ターン目はドローできません。`);
  if(G.noAtk&&G.noAtk.turn===G.turn&&G.noAtk.side===p)log(`「光の封陣」の効果で${N(p)}はこのターン攻撃できない。`,'p'+p);
  await standby(p);if(G.over)return;

}
function drawCards(p,n){

  for(let k=0;k<n;k++){
    if(!P.deck.length){log(`${N(p)}はデッキからドローできない！`);gameOver(1-p,`${N(p)}のデッキが尽きました。`);return false;}
    P.hand.push(P.deck.pop());
  }

}
async function endTurn(){
  if(G.over)return;
  G.busy=true;G.phase='end';closeModal();render();
  log(`${N(G.cur)}はターンを終了した。`,'p'+G.cur);
  returnStolen();

  render();
  await sleep(350);
  startTurn(1-G.cur);
}
async function damage(side,amt,battle){
  if(G.over)return;
  if(battle&&G.battleMod&&G.battleMod.side===side){
    if(G.battleMod.kind==='zero'){log(`「鏡面の盾」の効果で${N(side)}への戦闘ダメージは0になった！`,'p'+side);return;}
    if(G.battleMod.kind==='reflect'&&amt>0){log(`「報復の鏡」の効果でダメージは${N(1-side)}がかわりに受ける！`,'p'+side);return damage(1-side,amt,false);}
  }
  if(battle&&G.waboku&&G.waboku.side===side&&G.waboku.turn===G.turn){log(`「和睦の祈り」の効果で${N(side)}への戦闘ダメージは0になった！`,'p'+side);return;}
  if(amt<=0)return;
  const P=G.p[side];P.lp=Math.max(0,P.lp-amt);
  log(`${N(side)}に${amt}ダメージ！（LP ${P.lp}）`,'p'+side);
  floatLP(side,amt,false);
  await tweenLP(side);
  if(P.lp<=0)gameOver(1-side,`${N(side)}のライフポイントが0になりました。`);
}
function floatLP(side,amt,isHeal){
  netFx({fx:isHeal?'heal':'dmg',side,amt});

  if(isHeal)fxAt('dmg heal','+'+amt,pos,[{transform:'translate(-50%,-50%) scale(.5)',opacity:0},{transform:'translate(-50%,-90%) scale(1.2)',opacity:1,offset:.25},{transform:'translate(-50%,-170%)',opacity:0}],1100);
  else{fxAt('dmg','-'+amt,pos,[{transform:'translate(-50%,-50%) scale(.5)',opacity:0},{transform:'translate(-50%,-90%) scale(1.3)',opacity:1,offset:.25},{transform:'translate(-50%,-180%) scale(1)',opacity:0}],1100);
    shake(lpWrap(side),8);if(amt>=1500)shake($('#game'),5);}
}
async function heal(side,amt){
  if(trapOn('simochi',1-side)){log(`「毒杯の宴」の効果で回復はダメージに変わった！`,'p'+(1-side));return damage(side,amt,false);}
  const P=G.p[side];P.lp+=amt;log(`${N(side)}のLPが${amt}回復！（LP ${P.lp}）`,'p'+side);

}
function returnStolen(){
  for(const s of [0,1])for(let i=0;i<3;i++){const m=G.p[s].mz[i];if(!m||!m.stolen||m.stolen.from===s||m.stolen.perm)continue;giveBack(s,i);}
}
function giveBack(s,i){
  const m=G.p[s].mz[i];const o=m.stolen.from;G.p[s].mz[i]=null;m.stolen=null;const z=freeIdx(G.p[o].mz);
  if(z>=0){G.p[o].mz[z]=m;log(`「${m.card.name}」のコントロールは${N(o)}に戻った。`,'p'+o);}
  else{toGY(o,m.card);releaseAbsorb(m);detachEquips(m.uid);log(`「${m.card.name}」は戻る場所がなく墓地へ送られた。`,'p'+o);}
}
function releaseSnatch(uid){for(const s of [0,1]){const i=G.p[s].mz.findIndex(m=>m&&m.uid===uid);if(i>=0&&G.p[s].mz[i].stolen&&G.p[s].mz[i].stolen.perm){giveBack(s,i);render();}}}
function detachEquips(uid){
  for(const s of [0,1]){const P=G.p[s];P.sz.forEach((st,k)=>{if(st&&st.faceUp&&st.equipTo===uid){P.sz[k]=null;P.gy.push(st.card);log(`装備魔法「${st.card.name}」は墓地へ送られた。`,'p'+s);}});}
}
async function animOut(el,ms){if(el)await el.animate([{opacity:1,filter:'brightness(1)',transform:'scale(1)'},{opacity:.9,filter:'brightness(3)',transform:'scale(1.15)',offset:.3},{opacity:0,filter:'brightness(4) blur(3px)',transform:'scale(.4) rotate(25deg)'}],{duration:dur(ms),fill:'forwards'}).finished;}
async function destroyMon(side,i,opt={}){
  const P=G.p[side];const m=P.mz[i];if(!m)return;
  if(!opt.tribute)log(`「${m.card.name}」は破壊された${opt.banish?'（除外）':''}。`,'p'+side);
  netFx({fx:'out',side,zone:'m',i,ms:opt.tribute?350:550});
  await animOut(zoneInner(side,'m',i),opt.tribute?350:550);
  if(P.mz[i]!==m)return;
  const gs=m.stolen?m.stolen.from:side;m.stolen=null;
  P.mz[i]=null;if(opt.banish)toBan(gs,m.card);else toGY(gs,m.card);releaseAbsorb(m);detachEquips(m.uid);
  if(!opt.banish&&!m.card.token){if(!G.lostT)G.lostT=[-1,-1];G.lostT[side]=G.turn;}
  render();
  if(m.card.token&&m.card.fx&&m.card.fx.ojama&&!opt.tribute&&!G.over){log(`「${m.card.name}」が破壊され、${N(side)}は300ダメージを受ける。`,'p'+side);await damage(side,300,false);}
  if(opt.banish||m.card.token)return;
  const f4=m.card.fx||{};
  if(f4.toGY&&!G.over)await gySearch(gs,m.card);
  if(opt.battle&&f4.recruit&&!G.over)await recruit(gs,m.card);
  if(!opt.tribute&&m.card.fx&&m.card.fx.onDes&&!G.over){
    await sleep(250);
    log(`「${m.card.name}」の効果発動！`,'p'+gs);
    if(m.card.fx.onDes==='draw1')drawCards(gs,1);
    else await damage(1-gs,800,false);
  }
}
async function battleKill(side,i,opt={}){

  if(m.card.fx&&m.card.fx.noBattleDes){log(`「${m.card.name}」は戦闘では破壊されない！`,'p'+side);shake(zoneInner(side,'m',i),7);await sleep(400);return;}

  if(G.waboku&&G.waboku.side===side&&G.waboku.turn===G.turn){log(`「和睦の祈り」の効果で「${m.card.name}」は破壊されない！`,'p'+side);shake(zoneInner(side,'m',i),7);await sleep(400);return;}
  await destroyMon(side,i,{battle:true,banish:!!opt.banish});

async function banishMon(side,i){

async function gySearch(side,card){
  const k=card.fx.toGY,P=G.p[side];
  const seen=new Set(),l=[];for(const c of P.deck){if(c.type!=='monster'||c.god||c.fusion||c.token||seen.has(c.id))continue;if(k==='atk1500'?c.atk<=1500:c.def<=1500){seen.add(c.id);l.push(c);}}
  if(!l.length){log(`「${card.name}」の効果：対象となるモンスターがデッキにない。`,'p'+side);return;}
  log(`「${card.name}」の効果発動！`,'p'+side);
  const r=await humanPick(side,`「${card.name}」の効果：手札に加えるモンスターを選んでください`,l,{cancel:true,cpu:cs=>cpuHighIdx(cs)});
  if(r==null)return;const ix=P.deck.indexOf(l[r]);if(ix<0)return;
  P.hand.push(P.deck.splice(ix,1)[0]);shuffle(P.deck);log(`${N(side)}はデッキから「${l[r].name}」を手札に加えた。`,'p'+side);render();
}
async function recruit(side,card){
  const P=G.p[side],a=card.fx.recruit;const z=freeIdx(P.mz);if(z<0)return;
  const seen=new Set(),l=[];for(const c of P.deck){if(c.type==='monster'&&c.attr===a&&c.atk<=1500&&!c.god&&!c.fusion&&!c.ritual&&!c.fx?.chaos&&!c.fx?.ss3&&!seen.has(c.id)){seen.add(c.id);l.push(c);}}

  if(r==null||G.over)return;const ix=P.deck.indexOf(l[r]);const z2=freeIdx(P.mz);if(ix<0||z2<0)return;

}
function setDown(m){m.faceUp=false;m.pos='def';m.counters=0;G.fx.summon=m.uid;log(`「${m.card.name}」は裏側守備表示になった。`);}
async function discardFrom(side,idx,why){const P=G.p[side];const c=P.hand.splice(idx,1)[0];if(!c)return;P.gy.push(c);log(`${N(side)}は${why||''}「${c.name}」を捨てた。`,'p'+side);render();}
async function returnToHand(side,i){
  const P=G.p[side];const m=P.mz[i];if(!m)return;

  P.mz[i]=null;releaseAbsorb(m);detachEquips(m.uid);const os=m.stolen?m.stolen.from:side;m.stolen=null;

async function destroyST(side,k){

function gameOver(winner,reason){

    <div class="resmsg">${reason}<br>${msg}<br><span style="font-size:13px;color:#99a">ターン数：${G.turn}　${N(0)}のLP：${G.p[0].lp}　${N(1)}のLP：${G.p[1].lp}</span></div>
    ${mode==='online'?`<button class="bigbtn" id="btnRetry"${NET.connected?'':' disabled'}>もう一度（再戦）</button><div id="rematchMsg" class="hint"></div>`:`<button class="bigbtn" id="btnRetry">もう一度デュエル</button>`}<button class="subbtn" id="btnToTitle">タイトルへ</button>`;

  if(mode==='online'&&NET.rematch[1]){const e=$('#rematchMsg');if(e)e.textContent='相手が再戦を希望しています！';}

/* ================= ルール判定 ================= */
function canAct(){return G&&!G.over&&!G.busy&&!G.sel&&G.cur===G.view&&!isCPU(G.cur)&&(G.phase==='main'||G.phase==='battle');}
function canSummon(side,c){
  if(G.phase!=='main')return 'メインフェイズにのみ召喚できます';
  if(c.token)return 'トークンは召喚できません';
  if(c.fx&&c.fx.chaos)return 'このカードは通常召喚できません（墓地の光・闇を除外して特殊召喚）';
  if(c.fx&&c.fx.ss3)return 'このカードは通常召喚できません（墓地の闇属性3体を除外して特殊召喚）';
  if(c.ritual)return 'このカードは通常召喚できません（儀式魔法で降臨させます）';
  if(G.noNS&&G.noNS.turn===G.turn&&G.noNS.side===side)return 'このターンは通常召喚できません（身代わり綿毛羊）';
  if(G.normalSummoned&&!(G.extraNS>0))return 'このターンはすでに召喚・セットしました';
  const t=tribNeed(c);
  if(tribCap(side)<t)return `この召喚には生贄が${t}体必要です`;
  if(t===0&&freeIdx(G.p[side].mz)<0)return 'モンスターゾーンが空いていません';
  return true;
}
function canSpell(side,c,fromSz){
  const me=G.p[side],op=G.p[1-side];
  if(G.phase!=='main')return 'メインフェイズにのみ発動できます';
  const cont=isContSpell(c);
  if(cont&&!fromSz&&freeIdx(me.sz)<0)return '魔法・罠ゾーンが空いていません';
  switch(c.effect){
    case 'destroy':case 'bounce':if(!op.mz.some(Boolean))return '相手フィールドにモンスターがいません';break;
    case 'equip':if(!me.mz.some(m=>m&&m.faceUp))return '表側表示のモンスターがいません';break;
    case 'draw2':if(me.deck.length<2)return 'デッキが足りません';break;
    case 'wipeAll':if(!me.mz.some(Boolean)&&!op.mz.some(Boolean))return 'フィールドにモンスターがいません';break;
    case 'revive':if(!reviveList(side).length)return '墓地に特殊召喚できるモンスターがいません';if(freeIdx(me.mz)<0)return 'モンスターゾーンが空いていません';break;
    case 'search':if(!searchList(side).length)return 'デッキにレベル4以下のモンスターがいません';break;
    case 'destroyST':if(!op.sz.some(Boolean))return '相手フィールドに魔法・罠カードがありません';break;
    case 'charity':if(me.deck.length<3)return 'デッキが足りません';break;
    case 'duo':if(me.lp<=1000)return 'LPが足りません';if(!op.hand.length)return '相手の手札がありません';break;
    case 'snatch':case 'brain':if(!op.mz.some(m=>m&&m.faceUp&&!m.card.god))return '相手フィールドに表側表示のモンスターがいません';if(freeIdx(me.mz)<0)return 'モンスターゾーンが空いていません';if(c.effect==='brain'&&me.lp<=800)return 'LPが足りません';
      if(c.effect==='snatch'&&!fromSz&&freeIdx(me.sz)<0)return '魔法・罠ゾーンが空いていません';break;
    case 'quickST':if(!op.sz.some(Boolean))return '相手フィールドに魔法・罠カードがありません';break;
    case 'premature':if(me.lp<=800)return 'LPが足りません';if(!reviveList(side).length)return '墓地に特殊召喚できるモンスターがいません';if(freeIdx(me.mz)<0)return 'モンスターゾーンが空いていません';break;
    case 'quickMoon':if(!op.mz.some(m=>m&&m.faceUp&&!m.card.god))return '相手フィールドに表側表示のモンスターがいません';break;
    case 'nobleman':if(!op.mz.some(m=>m&&!m.faceUp))return '相手フィールドに裏側表示のモンスターがいません';break;
    case 'smashing':if(!op.mz.some(m=>m&&m.faceUp))return '相手フィールドに表側表示のモンスターがいません';break;
    case 'reborn':if(!rebornList(side).length)return 'お互いの墓地に特殊召喚できるモンスターがいません';if(freeIdx(me.mz)<0)return 'モンスターゾーンが空いていません';break;
    case 'raigeki':if(!op.mz.some(Boolean))return '相手フィールドにモンスターがいません';break;
    case 'goat':if(freeIdx(me.mz)<0)return 'モンスターゾーンが空いていません';if(G.cur===side&&G.normalSummoned)return 'このターンはすでに通常召喚しています';break;
    case 'confiscate':if(me.lp<=1000)return 'LPが足りません';if(!op.hand.length)return '相手の手札がありません';break;
    case 'sentry':if(!op.hand.length)return '相手の手札がありません';break;
    case 'vortex':if(me.hand.length-(fromSz?0:1)<1)return '捨てる手札がありません';if(!op.mz.some(m=>m&&m.faceUp))return '相手フィールドに表側表示のモンスターがいません';break;
    case 'swap':if(!me.mz.some(m=>m&&!(m.faceUp&&m.card.god)))return '入れ替える自分のモンスターがいません';if(!op.mz.some(m=>m&&!(m.faceUp&&m.card.god)))return '入れ替える相手のモンスターがいません';break;
    case 'ritual':{const r=ritualOK(side,c);if(r!==true)return r;break;}
    case 'dmAttack':if(!hasXenon(side))return '「黒衣の大魔導士ゼノン」が表側表示で必要です';if(!op.sz.some(Boolean))return '相手フィールドに魔法・罠カードがありません';break;
    case 'dmKnives':if(!hasXenon(side))return '「黒衣の大魔導士ゼノン」が表側表示で必要です';if(!op.mz.some(Boolean))return '相手フィールドにモンスターがいません';break;
    case 'upstart':if(me.deck.length<1)return 'デッキがありません';break;
    case 'reinforce':if(!reinfList(side).length)return 'デッキにレベル4以下の戦士族モンスターがいません';break;

function validSpellTarget(side,c,t,fromSz){

    case 'gyRecycle':return I&&!!me.gy[t]&&me.gy[t].type==='monster'&&!me.gy[t].fusion;
    case 'destroy':case 'bounce':case 'dmKnives':return I&&!!op.mz[t];

/* インテントの検証と実行（ローカル・ホスト共通。オンラインではホストのみが実行） */
async function execIntent(side,a){
  const bad=why=>{if(isRemote(side))log('（無効な操作は取り消されました）');render();sendState();};
  if(!a||typeof a!=='object'||!canActSide(side))return bad();
  const P=G.p[side],o=1-side;
  try{
    switch(a.t){
      case 'summon':{const c=P.hand[a.hi];if(!c||c.id!==a.cid||canSummon(side,c)!==true||(a.set&&c.god))return bad();
        const t=tribNeed(c),tr=Array.isArray(a.tribs)?a.tribs:[];
        if(new Set(tr).size!==tr.length||tr.some(i=>!Number.isInteger(i)||!P.mz[i]))return bad();
        const ws=tr.map(i=>tribW(P.mz[i])),wsum=ws.reduce((x,y)=>x+y,0);
        if(t===0?tr.length>0:(wsum<t||wsum-Math.min(...ws)>=t))return bad();
        G.busy=true;await doNormalSummon(side,c,!!a.set,tr);break;}
      case 'setST':{const c=P.hand[a.hi];const z=freeIdx(P.sz);if(!c||c.id!==a.cid||c.type==='monster'||z<0||G.phase!=='main')return bad();
        P.hand.splice(a.hi,1);P.sz[z]={uid:++uidc,card:c,faceUp:false,setTurn:G.turn};G.fx.summon=P.sz[z].uid;
        log(`${N(side)}は魔法・罠カードを1枚セットした。`,'p'+side);break;}
      case 'pos':{const m=P.mz[a.i];if(!m||!canChangePos(m))return bad();G.busy=true;await changePos(side,a.i);break;}
      case 'spell':{const fromSz=a.from==='s';const st=fromSz?P.sz[a.idx]:null;const c=fromSz?(st&&!st.faceUp?st.card:null):P.hand[a.idx];
        if(!c||c.type!=='spell'||c.id!==a.cid||canSpell(side,c,fromSz)!==true||!validSpellTarget(side,c,a.target,fromSz))return bad();
        G.busy=true;await castSpell(side,c,fromSz?'s':'h',a.idx,a.target);break;}
      case 'attack':{const m=P.mz[a.i];if(!m||!canAttack(m))return bad();
        if(a.ti===-1){if(monCount(o)&&!(m.card.fx&&m.card.fx.direct))return bad();}
        else if(!Number.isInteger(a.ti)||!G.p[o].mz[a.ti])return bad();
        await doAttack(side,a.i,a.ti);break;}
      case 'battle':{if(G.phase!=='main'||G.turn===1)return bad();
        G.phase='battle';log(`${N(side)}はバトルフェイズに入った。`,'p'+side);render();G.busy=true;await banner('バトルフェイズ',side===1);break;}
      case 'end':endTurn();return;
      case 'ign':{const m=P.mz[a.i];const kk=a.k==='ign2'?'ign2':'ign';const k=m&&m.card.fx&&m.card.fx[kk];if(!k||canIgnEff(side,m,k)!==true||!validIgnTarget(side,m,a.target,k))return bad();
        G.busy=true;await ignEffect(side,a.i,a.target,k);break;}
      case 'ssHand':{const c=P.hand[a.hi];if(!c||c.id!==a.cid||!c.fx||!(c.fx.chaos||c.fx.ss3)||canChaosSS(side,c)!==true)return bad();G.busy=true;await doChaosSS(side,a.hi);break;}
      case 'handIgn':{const c=P.hand[a.hi];if(!c||c.id!==a.cid||!c.fx||!c.fx.handIgn||canHandIgn(side,c)!==true)return bad();G.busy=true;await doHandIgn(side,a.hi);break;}
      case 'godEff':{const m=P.mz[a.i];if(!m||canGodEff(side,m)!==true)return bad();const tr=Array.isArray(a.tribs)?a.tribs:[];
        if(m.card.effect==='wipe'&&(tr.length!==2||new Set(tr).size!==2||tr.some(i=>i===a.i||!P.mz[i])))return bad();
        G.busy=true;await godEffect(side,a.i,tr);break;}
      default:return bad();
    }
  }catch(e){console.error(e);}
  if(!G.over)G.busy=false;
  render();sendState();
}

function humanPick(side,title,cards,opt={}){
  const run=async()=>{
    if(!cards.length||G.over)return null;
    if(isCPU(side))return opt.cpu?opt.cpu(cards):0;
    if(isRemote(side)){setWait(1-side,true,'相手が考え中…');const r=await remoteAsk('pick',{title,ids:cards.map(c=>c.id),cancel:!!opt.cancel});setWait(1-side,false);
      if(Number.isInteger(r)&&r>=0&&r<cards.length)return r;return opt.cancel?null:0;}
    if(G.mode==='online'&&side!==G.view)return opt.cancel?null:0;
    let swap=false;
    if(G.mode==='pvp'&&side!==G.view){await handover(side,`${N(side)}に渡してください`,'カードを選んでください');G.view=side;render();swap=true;}
    else setWait(1-side,true,'相手が考え中…');
    let r;do{r=await pickFromList(title,cards,!!opt.cancel);}while(r==null&&!opt.cancel);
    if(swap){await handover(G.cur,`${N(G.cur)}に戻してください`,'デュエルを続けます');G.view=G.cur;render();}else setWait(1-side,false);
    return r;};

}

async function humanSelect(side,prompt,cands,count){
  if(isRemote(side)){
    setWait(1-side,true,'相手が考え中…');
    const r=await remoteAsk('sel',{prompt,cands,count});
    setWait(1-side,false);
    if(!Array.isArray(r)||r.length!==count||r.some(i=>!cands.some(c=>c.i===i)))return null;
    return r;
  }
  if(G.mode==='online'&&side!==G.view)return null;
  if(G.mode==='pvp'&&side!==G.view){
    await handover(side,`${N(side)}に渡してください`,'効果の対象を選んでください');G.view=side;render();
    const r=await selectTargets(prompt,cands,count);
    await handover(G.cur,`${N(G.cur)}に戻してください`,'デュエルを続けます');G.view=G.cur;render();
    return r;
  }
  setWait(1-side,true,'相手が考え中…');
  const r=await selectTargets(prompt,cands,count);
  setWait(1-side,false);
  return r;
}

async function afterSummon(side,i){

      G.p[o].mz[target]=null;me.mz[z]=m;m.stolen=(m.stolen&&m.stolen.from===side)?null:{from:o};G.fx.summon=m.uid;

    case 'wipeST':{const ks=G.p[o].sz.map((x,k)=>x?k:-1).filter(k=>k>=0);log(`${N(o)}の魔法・罠カードを全て破壊！`,'p'+side);await Promise.all(ks.map(k=>destroyST(o,k)));break;}

async function payLP(side,v){const P=G.p[side];P.lp=Math.max(0,P.lp-v);log(`${N(side)}は${v}LPを払った。（LP ${P.lp}）`,'p'+side);await tweenLP(side);if(P.lp<=0)gameOver(1-side,`${N(side)}のライフポイントが0になりました。`);}
function summonGoats(side){const P=G.p[side];let n=0;for(let z=0;z<3;z++)if(!P.mz[z]){P.mz[z]=newInst(CARDS.k01,'def',true);G.fx.summon=P.mz[z].uid;n++;}render();return n;}
async function godEffect(side,i,tribs){

  await godFx(m.card,m.card.effect==='wipe'?'ゴッド・クラッシュ！':'太陽の祝福！');
  if(m.card.effect==='wipe'){
    log(`${N(side)}は${tribs.map(t=>'「'+P.mz[t].card.name+'」').join('')}を生贄に捧げた。`,'p'+side);

/* ================= 罠 ================= */
function trapUsable(side,c,ctx,trig){
  switch(c.effect){
    case 'destroyAttacker':return !ctx.A.card.god;
    case 'wipeAtk':return G.p[1-side].mz.some(m=>m&&m.pos==='atk'&&!m.card.god);
    case 'summonTrap':return !ctx.m.card.god&&atkOf(ctx.m)>=1500;
    case 'negateSpell':return G.p[side].lp>1000;
    case 'mirrorBurn':case 'bounceAtk':return !ctx.A.card.god;
    case 'negateEff':return !!ctx.m&&!ctx.m.card.god;
    case 'reviveTrap':return reviveList(side).length>0&&freeIdx(G.p[side].mz)>=0;
    case 'destroyST':return G.p[1-side].sz.some(Boolean);
    case 'skipDraw':return !G.skipDraw[1-side];
    case 'summonWeaken':return !ctx.m.card.god&&atkOf(ctx.m)>=1000;
    case 'allDefTrap':return G.p[1-side].mz.some(m=>m&&m.faceUp&&m.pos==='atk'&&!m.card.god);
    case 'quickPump':return !!ctx.tgt&&ctx.tgt.faceUp&&ctx.tgt.pos==='atk';
    case 'contWeaken':return G.p[1-side].mz.some(m=>m&&m.faceUp&&!m.card.god)||trig==='summon';
    case 'ring':case 'rBreak':case 'quickMoon':{const T=ctx.A||ctx.m;if(!T||!T.faceUp||T.card.god)return false;return c.effect!=='rBreak'||G.p[side].hand.length>0;}
    case 'bottomless':return !ctx.m.card.god&&atkOf(ctx.m)>=1500;
    case 'callDead':return reviveList(side).length>0&&freeIdx(G.p[side].mz)>=0;
    case 'solemn':return ctx.m?!ctx.m.card.god:true;
    case 'jammer':return G.p[side].hand.length>0;
    case 'greed':return G.p[side].deck.length>=2;
    case 'quickST':return G.p[1-side].sz.some(Boolean);
    case 'goat':return freeIdx(G.p[side].mz)>=0;
    case 'dimPrison':case 'evac':case 'enemyCtrl':case 'shrink':{const T=ctx.A||ctx.m;return !!T&&!T.card.god&&(c.effect!=='shrink'||T.faceUp)&&(c.effect!=='enemyCtrl'||T.faceUp);}
    case 'ruin':return G.p[1-side].mz.some(m=>m&&m.pos==='atk'&&!m.card.god);
    case 'ojama':return freeIdx(G.p[1-side].mz)>=0;
    case 'dustshoot':return G.p[1-side].hand.length>=4;
    case 'michizure':return G.p[1-side].mz.some(Boolean);
    case 'spellbind':case 'kunai':return !!ctx.A&&!ctx.A.card.god;
  }
  return true;
}
function trapsReady(side,trig,ctx){
  const lk=trapLocked();
  return G.p[side].sz.map((st,i)=>st&&!st.faceUp&&((st.card.type==='trap'&&!lk)||st.card.quick)&&st.setTurn<G.turn&&trigsOf(st.card).includes(trig)&&trapUsable(side,st.card,ctx,trig)?i:-1).filter(i=>i>=0);
}
async function askTrap(side,trig,ctx,desc){
  if(G.over)return null;
  const list=trapsReady(side,trig,ctx);
  const anySet=G.p[side].sz.some(s=>s&&!s.faceUp);
  if(isCPU(side))return list.length?(cpuTrapPick(side,trig,ctx,list)??null):null;
  if(G.mode==='online'){
    // 伏せカードが1枚でもあれば、発動可能かどうかに関係なく一定時間「応答待ち」にする（情報漏れ対策）
    if(!anySet)return null;
    const t0=performance.now();const att=1-side;
    setWait(att,true,'相手の応答待ち…');
    let r=null;
    if(list.length){
      if(isRemote(side)){r=await remoteAsk('trap',{list,desc});if(!list.includes(r))r=null;}
      else r=await trapPrompt(side,list,desc);
    }
    const rest=dur(1500)-(performance.now()-t0);if(rest>0)await new Promise(x=>setTimeout(x,rest));
    setWait(att,false);
    return r;
  }
  if(G.mode==='pvp'){
    const force=trig==='attack'&&anySet;
    if(!list.length&&!force)return null;
    const swap=G.view!==side;
    if(swap){await handover(side,`${N(side)}に渡してください`,'相手が攻撃・行動を宣言しました');G.view=side;render();}
    const r=list.length?await trapPrompt(side,list,desc):await infoOk(`${desc}<br><br>今は発動できる罠カードはありません。`);
    if(swap){await handover(G.cur,`${N(G.cur)}に戻してください`,r!=null?'罠カードが発動されました！':'デュエルを続けます');G.view=G.cur;render();}
    return r;
  }
  if(!list.length)return null;
  return await trapPrompt(side,list,desc);
}
function infoOk(html){
  return new Promise(res=>{const b=showModal(`<h3>相手の行動</h3><p style="text-align:center">${html}</p><div class="acts"><button class="abtn gray">OK</button></div>`,null);
    b.querySelector('button').onclick=()=>{closeModal();res(null);};});
}
function trapPrompt(side,list,desc){
  return new Promise(res=>{
    const P=G.p[side];
    let html=`<h3>⚠ 罠カード発動のチャンス！</h3><p style="text-align:center">${desc}<br><b>${G.mode==='pvp'?N(side)+'、':''}罠カードを発動しますか？</b></p><div class="gylist" style="--w:96px">`;
    html+=list.map(i=>`<div data-t="${i}" style="cursor:pointer">${cardHTML(P.sz[i].card)}</div>`).join('')+'</div>';
    if(list.some(i=>P.sz[i].card.quick))html+=`<div class="hint" style="margin-top:0">※速攻魔法もここから発動できます</div>`;
    html+=`<div class="acts">${list.map(i=>`<button class="abtn red" data-t="${i}">「${P.sz[i].card.name}」を発動</button>`).join('')}<button class="abtn gray" data-t="-1">発動しない</button></div>`;
    html+=`<div class="hint">${list.map(i=>`【${P.sz[i].card.name}】${P.sz[i].card.text}`).join('<br>')}</div>`;
    const b=showModal(html,null);
    b.querySelectorAll('[data-t]').forEach(x=>x.onclick=()=>{const v=+x.dataset.t;closeModal();res(v>=0?v:null);});
  });
}
async function activateTrap(side,k,ctx){

  const o=1-side;

    case 'reviveTrap':{const l=reviveList(side).sort((x,y)=>y.c.atk-x.c.atk);const z=freeIdx(P.mz);log('攻撃は無効になった！','p'+side);
      if(l.length&&z>=0){const card=P.gy.splice(l[0].i,1)[0];P.mz[z]=newInst(card,'def',true);G.fx.summon=P.mz[z].uid;log(`${N(side)}は墓地から「${card.name}」を守備表示で特殊召喚！`,'p'+side);render();await sleep(400);await afterSummon(side,z);}

    case 'allDefTrap':{G.p[o].mz.forEach(m=>{if(m&&m.faceUp&&m.pos==='atk'&&!m.card.god)m.pos='def';});log(`攻撃は無効になり、${N(o)}の攻撃表示モンスターは全て守備表示になった！`,'p'+side);render();return 'negateOne';}
    case 'quickBurn':await damage(o,600,false);return 'ok';

    case 'torrential':{log('フィールドのモンスターを全て破壊！','p'+side);const js=[];for(const s2 of [0,1])G.p[s2].mz.forEach((m,j)=>{if(m&&!m.card.god)js.push(destroyMon(s2,j));});await Promise.all(js);return 'destroyed';}
    case 'ring':{const T=ctx.A||ctx.m,ts=ctx.A?ctx.a:ctx.side;const ti=G.p[ts].mz.indexOf(T);if(ti<0)return 'ok';const v=atkOf(T);await destroyMon(ts,ti);await damage(ts,v,false);await damage(side,v,false);return 'destroyed';}

    case 'callDead':{const l=reviveList(side).sort((x,y)=>y.c.atk-x.c.atk);const z=freeIdx(P.mz);if(l.length&&z>=0){const card=P.gy.splice(l[0].i,1)[0];P.mz[z]=newInst(card,'atk',true);G.fx.summon=P.mz[z].uid;log(`${N(side)}は墓地から「${card.name}」を攻撃表示で特殊召喚！`,'p'+side);render();await sleep(400);}return 'ok';}

    case 'quickST':{const k2=cpuPickST(o);if(k2>=0)await destroyST(o,k2);return 'ok';}
    case 'quickMoon':{const T=ctx.A||ctx.m;if(T&&T.faceUp){setDown(T);render();}return ctx.A?'negateOne':'ok';}
    case 'goat':{const n=summonGoats(side);log(`${N(side)}は「綿毛羊トークン」を${n}体特殊召喚！`,'p'+side);if(ctx.A){log('攻撃は無効になった。','p'+side);return 'negateOne';}return 'ok';}
    case 'dimPrison':await destroyMon(ctx.a,ctx.ai,{banish:true});return 'destroyed';
    case 'ruin':{let b=-1,bv=-1;G.p[o].mz.forEach((m,i)=>{if(m&&m.pos==='atk'&&!m.card.god&&atkOf(m)>bv){bv=atkOf(m);b=i;}});if(b>=0)await destroyMon(o,b);return 'ok';}
    case 'waboku':G.waboku={side,turn:G.turn};log(`このターン、${N(side)}のモンスターは戦闘で破壊されず、戦闘ダメージも受けない！`,'p'+side);return 'ok';
    case 'ojama':{const O=G.p[o];let n=0;for(let z=0;z<3;z++)if(!O.mz[z]){O.mz[z]=newInst(CARDS.k02,'def',true);G.fx.summon=O.mz[z].uid;n++;}render();log(`${N(o)}のフィールドに「邪魔者トークン」が${n}体特殊召喚された！`,'p'+side);return 'ok';}
    case 'evac':{const T=ctx.A||ctx.m,ts=ctx.A?ctx.a:ctx.side;const ti=G.p[ts].mz.indexOf(T);if(ti>=0)await returnToHand(ts,ti);return 'destroyed';}
    case 'dustshoot':{const O=G.p[o];log(`${N(side)}は${N(o)}の手札を確認した。`,'p'+side);const l=O.hand.filter(x=>x.type==='monster');
      if(!l.length){await humanPick(side,`${N(o)}の手札（モンスターカードはありません）`,O.hand.slice(),{cancel:true,cpu:()=>null});log('モンスターカードがなかった。','p'+side);return 'ok';}
      const r=await humanPick(side,`${N(o)}の手札のモンスター：デッキに戻すカードを選んでください`,l,{cpu:cs=>cpuHighIdx(cs)});const x=l[r==null?0:r];const ix=O.hand.indexOf(x);
      if(ix>=0){O.hand.splice(ix,1);O.deck.push(x);shuffle(O.deck);log(`「${x.name}」は${N(o)}のデッキに戻された。`,'p'+side);}return 'ok';}
    case 'decree':log('このカード以外の罠カードの効果は無効になる！','p'+side);return 'ok';
    case 'michizure':{const cands=monCands(o);if(!cands.length)return 'ok';let k;if(isCPU(side))k=cpuBestOpp(side);else{const r=await humanSelect(side,'「道連れの呪詛」：破壊する相手モンスターを選んでください',cands,1);k=r?r[0]:cands[0].i;}
      if(G.p[o].mz[k])await destroyMon(o,k);return 'ok';}
    case 'robbin':log(`${N(side)}のモンスターが戦闘ダメージを与えるたびに、${N(o)}は手札をランダムに捨てる！`,'p'+side);return 'ok';
    case 'simochi':log(`${N(o)}のLP回復はダメージに変わる！`,'p'+side);return 'ok';
    case 'spellbind':{const st=P.sz[k];if(st&&G.p[ctx.a].mz[ctx.ai]===ctx.A){st.equipTo=ctx.A.uid;log(`「${ctx.A.card.name}」は呪縛された！`,'p'+side);}render();return 'negateOne';}
    case 'kunai':{const A=ctx.A;if(A&&A.faceUp){A.pos='def';G.fx.summon=A.uid;}let b=null;for(const m of P.mz)if(m&&m.faceUp&&(!b||atkOf(m)>atkOf(b)))b=m;if(b){addTmp(b,500);log(`「${b.card.name}」の攻撃力が500アップ！`,'p'+side);}log('攻撃は無効になった。','p'+side);render();return 'negateOne';}
    case 'enemyCtrl':{const A=ctx.A;if(A&&A.faceUp){A.pos='def';G.fx.summon=A.uid;log(`「${A.card.name}」は守備表示になり、攻撃は無効になった！`,'p'+side);}render();return 'negateOne';}
    case 'shrink':{const A=ctx.A;if(A&&A.faceUp){addTmp(A,-Math.floor(A.card.atk/2));log(`「${A.card.name}」の攻撃力はターン終了時まで半分ダウン！（ATK ${atkOf(A)}）`,'p'+side);}render();return 'ok';}
    case 'negate':log('攻撃は無効になり、バトルフェイズが終了した。','p'+side);G.battleOver=true;return 'negate';

    case 'noDamage':G.battleMod={side,kind:'zero'};await heal(side,500);return 'ok';

    case 'wipeAtk':{const o=1-side;const idx=G.p[o].mz.map((m,i)=>m&&m.pos==='atk'&&!m.card.god?i:-1).filter(i=>i>=0);log(`${N(o)}の攻撃表示モンスターを全て破壊！`,'p'+side);await Promise.all(idx.map(i=>destroyMon(o,i)));return 'ok';}
    case 'summonTrap':await destroyMon(ctx.side,ctx.i);return 'destroyed';

  }
  return 'ok';
}

/* ================= バトル ================= */
async function doAttack(a,ai,ti){
  if(G.over)return;
  G.busy=true;const d=1-a;const A=G.p[a].mz[ai];if(!A){G.busy=false;return;}G.blost=[];
  if(A.attackedTurn===G.turn)A.atk2Turn=G.turn;else A.attackedTurn=G.turn;
  const tgt=ti>=0?G.p[d].mz[ti]:null;
  const tname=tgt?(tgt.faceUp?'「'+tgt.card.name+'」':'裏側守備モンスター'):null;
  log(`${N(a)}の「${A.card.name}」（ATK ${atkOf(A)}）が${tgt?`${tname}に攻撃！`:'ダイレクトアタック！'}`,'p'+a);
  render();
  const el=zoneInner(a,'m',ai);if(el)await el.animate([{transform:'scale(1)'},{transform:'scale(1.15)',filter:'drop-shadow(0 0 8px red)'},{transform:'scale(1)'}],{duration:dur(400)}).finished;
  const ctx={A,a,ai,tgt,ti};
  const tr=await askTrap(d,'attack',ctx,`${N(a)}の「${A.card.name}」（ATK ${atkOf(A)}）が${tgt?`${N(d)}の${tname}に`:`${N(d)}に直接`}攻撃してきた！`);
  if(tr!=null){
    const r=await activateTrap(d,tr,ctx);
    if(G.over)return;
    if(r==='negate'||r==='negateOne'){G.busy=false;G.battleMod=null;render();return;}
  }
  if(G.p[a].mz[ai]!==A||!A.faceUp){G.busy=false;G.battleMod=null;render();return;}
  if(tgt&&G.p[d].mz[ti]!==tgt){log('攻撃対象がいなくなったため、攻撃は中止された。');G.busy=false;G.battleMod=null;render();return;}
  if(tgt&&tgt.faceUp&&tgt.card.fx&&tgt.card.fx.negAtk&&tgt.negTurn!==G.turn){
    tgt.negTurn=G.turn;G.fx.summon=tgt.uid;log(`「${tgt.card.name}」の効果！攻撃は無効になった。`,'p'+d);render();shake(zoneInner(d,'m',ti),7);await sleep(600);
    G.busy=false;G.battleMod=null;render();return;}
  await animAttack(a,ai,d,ti);
  const lp0=G.p[d].lp;const bbA=!!(A.card.fx&&A.card.fx.banishBattle);const wasFD=!!tgt&&!tgt.faceUp;
  if(!tgt){await preDamage(a,ai,A,d,-1,null);if(G.over)return;if(G.p[a].mz[ai]===A)await damage(d,atkOf(A),true);}
  else{
    if(!tgt.faceUp){tgt.faceUp=true;log(`裏側モンスターは「${tgt.card.name}」（DEF ${defOf(tgt)}）だった！`,'p'+d);G.fx.summon=tgt.uid;render();await sleep(600);
      if(tgt.card.fx&&tgt.card.fx.flip){await flipEffect(d,ti);if(G.over)return;
        if(G.p[a].mz[ai]!==A||G.p[d].mz[ti]!==tgt){log('戦闘は行われなかった。');G.busy=false;G.battleMod=null;render();return;}}}
    const pr=await preDamage(a,ai,A,d,ti,tgt);if(G.over)return;
    if(pr==='stop'||G.p[a].mz[ai]!==A||G.p[d].mz[ti]!==tgt){G.busy=false;G.battleMod=null;render();return;}
    const av=atkOf(A);const bbT=!!(tgt.card.fx&&tgt.card.fx.banishBattle);
    if(tgt.pos==='atk'){
      const dv=atkOf(tgt);
      if(av>dv){await battleKill(d,ti,{banish:bbA});await damage(d,av-dv,true);}
      else if(av===dv){log('攻撃力が同じため、相打ち！');await Promise.all([battleKill(d,ti,{banish:bbA}),battleKill(a,ai,{banish:bbT})]);}
      else{log('攻撃側が返り討ちにあった！');await battleKill(a,ai,{banish:bbT});await damage(a,dv-av,true);}
    }else{
      const dv=defOf(tgt);
      if(av>dv){await battleKill(d,ti,{banish:bbA});if(A.card.fx&&A.card.fx.pierce){log(`「${A.card.name}」の貫通ダメージ！`,'p'+a);await damage(d,av-dv,true);}}
      else if(av<dv){log('守備力が上回った！反射ダメージ！');await damage(a,dv-av,true);}
      else log('攻撃力と守備力が同じ。どちらも破壊されない。');
    }
  }
  if(!G.over)await afterBattle(a,ai,A,d,ti,tgt,lp0-G.p[d].lp,wasFD);
  G.battleMod=null;
  if(!G.over){G.busy=false;render();}
}


async function preDamage(a,ai,A,d,ti,tgt){
  // 賭博侍：コイントス
  for(const [me,M,os,O,oi] of [[a,A,d,tgt,ti],[d,tgt,a,A,ai]]){
    if(!M||!O||!M.faceUp||!M.card.fx||!M.card.fx.coinKill||G.over)continue;
    log(`「${M.card.name}」の効果！`,'p'+me);const h=await coins(1,me);
    if(h&&G.p[os].mz[oi]===O&&!O.card.god){await destroyMon(os,oi);return 'stop';}}
  // 反射の跳躍兵
  if(tgt&&tgt.faceUp&&tgt.pos==='atk'&&tgt.card.fx&&tgt.card.fx.reflectB&&!G.over){log(`「${tgt.card.name}」の効果！攻撃力分のダメージを跳ね返す！`,'p'+d);await damage(a,atkOf(A),false);if(G.over)return 'stop';}
  // 注射天使リリィ
  for(const [me,M] of [[a,A],[d,tgt]]){
    if(!M||!M.faceUp||!M.card.fx||!M.card.fx.lily||G.p[me].lp<=2000||G.over)continue;
    const opp=me===a?tgt:A;
    const r=await humanPick(me,`「${M.card.name}」の効果：2000LP払って攻撃力を3000アップしますか？（カードを選ぶと発動）`,[M.card],{cancel:true,cpu:()=>{const ov=opp?(opp.pos==='atk'||me===d?atkOf(opp):defOf(opp)):0;return G.p[me].lp>=4000&&(opp?ov>=atkOf(M):G.p[1-me].lp<=atkOf(M)+3000)?0:null;}});
    if(r===0){await payLP(me,2000);if(G.over)return 'stop';addTmp(M,3000);log(`「${M.card.name}」の攻撃力が3000アップ！（ATK ${atkOf(M)}）`,'p'+me);render();await sleep(300);}}
  return 'ok';
}
async function afterBattle(a,ai,A,d,ti,tgt,dealt,wasFD){
  const f=A.card.fx||{};const onF=G.p[a].mz[ai]===A;
  if(dealt>0){
    const rb=trapOn('robbin',a);if(rb&&G.p[d].hand.length&&!G.over){log(`「${rb.card.name}」の効果！`,'p'+a);await discardFrom(d,Math.floor(Math.random()*G.p[d].hand.length),'ランダムに');}
    if(onF&&f.dmgMill&&!G.over){const D=G.p[d];const n=Math.min(f.dmgMill,D.deck.length);for(let k=0;k<n;k++)D.gy.push(D.deck.pop());log(`「${A.card.name}」の効果で${N(d)}はデッキの上から${n}枚を墓地へ送った。`,'p'+a);render();}
    if(onF&&f.zaloog&&!G.over){log(`「${A.card.name}」の効果！`,'p'+a);const D=G.p[d];if(D.hand.length)await discardFrom(d,Math.floor(Math.random()*D.hand.length),'ランダムに');else{const n=Math.min(2,D.deck.length);for(let k=0;k<n;k++)D.gy.push(D.deck.pop());log(`${N(d)}はデッキの上から${n}枚を墓地へ送った。`,'p'+a);render();}}
  }
  if(tgt&&!G.over){const tOn=G.p[d].mz[ti]===tgt;
    if(wasFD&&tgt.card.fx&&tgt.card.fx.marsh){log(`「${tgt.card.name}」の効果！`,'p'+d);await damage(a,1000,false);}
    if(tOn&&tgt.card.fx&&tgt.card.fx.reflectB&&tgt.pos==='atk'&&!G.over){await destroyMon(d,ti);}
    else if(tOn&&tgt.faceUp&&tgt.pos==='def'&&tgt.card.fx&&tgt.card.fx.toAtkAfter){tgt.pos='atk';G.fx.summon=tgt.uid;log(`「${tgt.card.name}」は攻撃表示になった。`,'p'+d);render();}}
  for(const s2 of [...new Set(G.blost||[])]){if(G.over)break;const t=await askTrap(s2,'lost',{side:s2},`${N(s2)}のモンスターが戦闘で破壊された！`);if(t!=null)await activateTrap(s2,t,{side:s2});}
  G.blost=[];
  if(dealt>0&&onF){
    if(f.dmgDiscard&&!tgt&&G.p[d].hand.length){log(`「${A.card.name}」の効果！`,'p'+a);await discardFrom(d,Math.floor(Math.random()*G.p[d].hand.length),'ランダムに');}
    if(f.dmgDraw){log(`「${A.card.name}」の効果！`,'p'+a);drawCards(a,1);}
    if(f.dmgBanishGY){const g=G.p[d].gy;const l=g.filter(c=>c.type==='monster').sort((x,y)=>cardVal(y)-cardVal(x)).slice(0,2);
      if(l.length){for(const c of l){g.splice(g.indexOf(c),1);G.p[d].ban.push(c);}log(`「${A.card.name}」の効果で${N(d)}の墓地の${l.map(c=>'「'+c.name+'」').join('')}を除外！`,'p'+a);render();}}
  }
  const ladyA=!!f.ddLady,ladyT=!!(tgt&&tgt.faceUp&&tgt.card.fx&&tgt.card.fx.ddLady);
  if(tgt&&(ladyA||ladyT)&&!G.over){const tOn=G.p[d].mz[ti]===tgt;

  let q=by('gravity');if(q!=null&&O.mz.some(m=>m&&m.faceUp&&m.card.lv>=4&&!m.card.god&&atkOf(m)>=1500))return q;
  q=by('quickST');if(q!=null&&O.sz.some(s=>s&&(!s.faceUp||s.card.cont||s.card.effect==='snatch')))return q;
  q=by('greed');if(q!=null&&P.hand.length<=2&&Math.random()<.5)return q;
  q=by('callDead');if(q!=null&&reviveList(side).some(x=>x.c.atk>=1600))return q;
  if(trig==='lost'){return by('michizure');}
  q=by('decree');if(q!=null&&(O.sz.some(s=>s&&!s.faceUp)||Math.random()<.3)&&!P.sz.some(s=>s&&!s.faceUp&&s.card.type==='trap'&&s.card.effect!=='decree'))return q;
  q=by('robbin');if(q!=null&&P.mz.some(m=>m&&m.faceUp&&m.pos==='atk'))return q;
  q=by('simochi');if(q!=null&&Math.random()<.5)return q;
  q=by('ojama');if(q!=null&&G.p[1-side].mz.filter(m=>!m).length>=2&&Math.random()<.6)return q;
  q=by('dustshoot');if(q!=null&&G.p[1-side].hand.length>=4)return q;
  if(trig==='summon'&&bigT){q=by('evac');if(q!=null)return q;}
  if(trig==='summon'&&bigT){for(const e of ['bottomless','torrential','rBreak','ring','quickMoon','solemn']){q=by(e);if(q==null)continue;
    if(e==='torrential'&&monCount(side)>monCount(1-side))continue;if(e==='ring'&&P.lp<=atkOf(T0)+500)continue;if(e==='solemn'&&P.lp<3000)continue;return q;}}
  if(trig==='summon'&&!bigT){q=by('torrential');if(q!=null&&monCount(1-side)>=3&&monCount(side)<=1)return q;}
  if(trig==='spell'&&['raigeki','snatch','wipeAll','reborn','charity','duo','brain','swap','confiscate','fusion','destroy'].includes(ctx.c.effect)){for(const e of ['jammer','solemn']){q=by(e);if(q!=null&&(e!=='solemn'||P.lp>3000))return q;}}
  let q2=null;
  q=by('contWeaken');if(q!=null&&O.mz.some(m=>m&&m.faceUp&&!m.card.god))return q;
  q=by('contBurn');if(q!=null)return q;
  q=by('destroyST');if(q!=null&&O.sz.some(s=>s&&(!s.faceUp||s.card.cont||s.card.effect==='field'||s.card.effect==='equip')))return q;
  q=by('skipDraw');if(q!=null&&Math.random()<.6)return q;
  if(trig==='effect'){const f=ctx.m.card.fx||{};const imp=f.ign==='destroyLower'||f.ign==='ssLv4'||f.flip==='destroy'||f.sum==='destroyST'||f.sum==='burn500';return (imp||Math.random()<.4)?by('negateEff'):null;}
  if(trig==='attack'){
    const A=ctx.A,tgt=ctx.tgt,av=atkOf(A);let threat=false,dmg=0;
    if(!tgt){dmg=av;threat=av>=1000;}
    else if(tgt.pos==='atk'){const dv=atkOf(tgt);if(av>=dv){threat=true;dmg=av-dv;}}
    else{const dv=defOf(tgt);if(av>dv){threat=true;dmg=A.card.fx&&A.card.fx.pierce?av-dv:0;}}
    const oppAtk=G.p[1-side].mz.filter(m=>m&&m.pos==='atk'&&!m.card.god).length;
    let r=by('wipeAtk');if(r!=null&&(oppAtk>=2||(threat&&oppAtk>=1)))return r;
    r=by('quickPump');if(r!=null&&tgt&&tgt.faceUp&&tgt.pos==='atk'&&atkOf(tgt)<=av&&atkOf(tgt)+800>av)return r;
    if(!threat){r=by('quickBurn');return r!=null&&Math.random()<.4?r:null;}
    r=by('dimPrison');if(r!=null&&(av>=1500||tribNeed(A.card)>0))return r;
    r=by('evac');if(r!=null&&(tribNeed(A.card)>0||A.card.ritual||A.card.fx&&A.card.fx.chaos||av>=2000))return r;
    r=by('ruin');if(r!=null&&(oppAtk>=2||av>=1500))return r;
    r=by('shrink');if(r!=null&&tgt&&tgt.faceUp&&tgt.pos==='atk'&&atkOf(tgt)<=av&&atkOf(tgt)>av-Math.floor(A.card.atk/2))return r;
    r=by('spellbind');if(r!=null&&av>=1600)return r;
    r=by('kunai');if(r!=null&&dmg>=800)return r;
    r=by('enemyCtrl');if(r!=null&&dmg>=1000)return r;
    r=by('waboku');if(r!=null&&(dmg>=1200||(tgt&&tgt.faceUp&&cardVal(tgt.card)>=1800)))return r;
    r=by('cylinder');if(r!=null&&av>=1500)return r;
    r=by('mirrorBurn');if(r!=null)return r;
    r=by('rBreak');if(r!=null)return r;
    r=by('quickMoon');if(r!=null&&av>=1500)return r;
    r=by('ring');if(r!=null&&P.lp>av+800&&av>=1700)return r;
    r=by('goat');if(r!=null&&(!tgt||dmg>=1500))return r;
    r=by('destroyAttacker');if(r!=null)return r;
    r=by('bounceAtk');if(r!=null&&(tribNeed(A.card)>0||av>=1900))return r;
    r=by('allDefTrap');if(r!=null&&(oppAtk>=2||dmg>=1500))return r;
    r=by('reviveTrap');if(r!=null&&(dmg>=1200||!tgt))return r;
    r=by('reflect');if(r!=null&&dmg>=1000)return r;
    r=by('negate');if(r!=null)return r;
    r=by('noDamage');if(r!=null&&dmg>=800)return r;
    r=by('quickBurn');if(r!=null)return r;
    return null;
  }
  if(trig==='summon'){const m=ctx.m;const big=atkOf(m)>=1700||tribNeed(m.card)>0||m.card.fusion;
    let r=big?by('summonTrap'):null;if(r!=null)return r;
    r=by('summonWeaken');if(r!=null&&atkOf(m)>=1600)return r;
    r=by('quickBurn');if(r!=null&&Math.random()<.4)return r;
    return null;}
  if(trig==='spell'){
    const e=ctx.c.effect;
    const imp=['wipeAll','destroy','bounce','fusion','revive','destroyST','raigeki','snatch','reborn','swap','duo'].includes(e)||(e==='burn'&&P.lp<=1000);
    if(!imp||P.lp<=2000)return null;
    if(e==='wipeAll'){const v=s=>G.p[s].mz.filter(Boolean).reduce((a,m)=>a+mval(m),0);if(v(side)<v(1-side))return null;}
    return by('negateSpell');
  }
  return null;
}
async function cpuTurn(){

const NET={role:null,peer:null,conn:null,side:0,code:null,guestDeck:'std',connected:false,lost:false,lastRx:0,hb:null,pend:{},askId:0,rematch:[false,false],resultShown:false,stateQueued:false};

const PEER_PREFIX='ygduel-';
const CODE_CH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function isRemote(s){return !!G&&G.mode==='online'&&NET.role==='host'&&s===1;}
function genCode(){const a=new Uint32Array(6);crypto.getRandomValues(a);let s='';for(const x of a)s+=CODE_CH[x%CODE_CH.length];return s;}

function netSend(o){try{if(NET.conn&&NET.conn.open)NET.conn.send(o);}catch(e){console.warn(e);}}

function queueState(){if(NET.stateQueued)return;NET.stateQueued=true;setTimeout(()=>{NET.stateQueued=false;sendState();},0);}
function errText(e){return ({'peer-unavailable':'部屋が見つかりません','network':'ネットワークエラー','server-error':'サーバーエラー','unavailable-id':'コードが使用中です','browser-incompatible':'このブラウザは非対応です','socket-error':'サーバーに接続できません','socket-closed':'サーバーとの接続が切れました'})[e&&e.type]||('通信エラー（'+(e&&e.type||e)+'）');}

function snapFor(viewer){

    return {lp:P.lp,deckKey:P.deckKey,deckN:P.deck.length,deck:own?P.deck.map(c=>c.id).sort():null,ban:P.ban.map(c=>c.id),
      hand:own?P.hand.map(c=>c.id):P.hand.length,
      mz:P.mz.map(m=>m&&{uid:m.uid,cid:(m.faceUp||own)?m.card.id:null,pos:m.pos,faceUp:m.faceUp,summonTurn:m.summonTurn,posChangedTurn:m.posChangedTurn,attackedTurn:m.attackedTurn,boost:m.boost,effTurn:m.effTurn,guardTurn:m.guardTurn,negTurn:m.negTurn,tmp:m.tmp,stolen:m.stolen,counters:m.counters||0,dblAtkTurn:m.dblAtkTurn,atk2Turn:m.atk2Turn,absorb:m.faceUp?(m.absorb||null):null}),
      sz:P.sz.map(st=>st&&{uid:st.uid,cid:(st.faceUp||own)?st.card.id:null,faceUp:st.faceUp,setTurn:st.setTurn,equipTo:st.equipTo||null,cnt:st.faceUp?(st.cnt||0):0}),

function onNetData(m){
  NET.lastRx=Date.now();if(!m||typeof m!=='object')return;
  if(NET.role==='host'){
    switch(m.k){
      case 'hello':
        NET.guestDeck=(DECKS[m.deck]||m.deck==='random')?m.deck:'std';

        setTimeout(()=>{if(NET.connected&&!(G&&G.mode==='online'&&!G.over))startGame();},800);break;

function setupConn(conn){
  conn.on('open',()=>{
    NET.connected=true;NET.lastRx=Date.now();clearTimeout(NET.joinTimer);
    if(NET.role==='guest'){conn.send({k:'hello',deck:setup.deck[0]});netStatus('接続しました！ホストがデュエルを開始します…','ok');}
    startHeartbeat();

  conn.on('error',()=>netLost());

function startHeartbeat(){clearInterval(NET.hb);NET.hb=setInterval(()=>{netSend({k:'ping'});if(Date.now()-NET.lastRx>15000)netLost();},2000);}
function hostCreate(tries=0){
  if(typeof Peer==='undefined'){netStatus('通信ライブラリを読み込めませんでした','err');return;}
  const code=genCode();NET.code=code;$('#roomCode').textContent=code;netStatus('サーバーに接続中…');
  const peer=new Peer(peerIdOf(code),{config:{iceServers:ICE_SERVERS},debug:0});NET.peer=peer;
  peer.on('open',()=>{if(NET.peer===peer)netStatus('相手の参加を待っています…\nコードを相手に伝えてください');});
  peer.on('connection',conn=>{
    if(NET.conn){conn.on('open',()=>{conn.send({k:'full'});setTimeout(()=>conn.close(),500);});return;}
    NET.conn=conn;setupConn(conn);
  });
  peer.on('error',e=>{
    if(NET.peer!==peer)return;
    if(e.type==='unavailable-id'&&tries<3){peer.destroy();hostCreate(tries+1);return;}
    if(NET.connected&&(e.type==='network'||e.type==='server-error'||e.type==='socket-error'||e.type==='socket-closed'))return; // 対戦中はブローカー切断を無視（P2Pは継続）
    netStatus('エラー：'+errText(e),'err');
    if(G&&G.mode==='online'&&!G.over)netLost();
  });
  peer.on('disconnected',()=>{if(NET.peer===peer&&!NET.connected){try{peer.reconnect();}catch(e){}}});
}
function guestJoin(){
  if(typeof Peer==='undefined'){netStatus('通信ライブラリを読み込めませんでした','err');return;}
  const code=$('#codeInput').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(code.length!==6){netStatus('6文字の部屋コードを入力してください','err');return;}
  if(NET.peer){try{NET.peer.destroy();}catch(e){}NET.peer=null;NET.conn=null;}
  netStatus('接続中…');$('#btnJoinGo').disabled=true;
  const peer=new Peer({config:{iceServers:ICE_SERVERS},debug:0});NET.peer=peer;
  peer.on('open',()=>{
    const conn=peer.connect(peerIdOf(code),{reliable:true});NET.conn=conn;setupConn(conn);
    NET.joinTimer=setTimeout(()=>{if(!NET.connected){netStatus('接続できませんでした。コードを確認するか、同じWi-Fiで試してください','err');$('#btnJoinGo').disabled=false;}},20000);
  });
  peer.on('error',e=>{
    if(NET.peer!==peer)return;
    if(NET.connected&&e.type!=='peer-unavailable')return;
    netStatus('エラー：'+errText(e),'err');$('#btnJoinGo').disabled=false;
    if(G&&G.mode==='online'&&!G.over)netLost();
  });
}
function netLost(){
  if(!NET.role||NET.lost)return;
  NET.lost=true;NET.connected=false;clearInterval(NET.hb);
  for(const k in NET.pend){const f=NET.pend[k];delete NET.pend[k];f(null);}
  showWait(false);
  const inGame=G&&G.mode==='online';
  if(inGame&&!G.over){G.over=true;G.busy=true;}
  if(inGame||!$('#lobby').classList.contains('hidden')){
    G&&(G.sel=null);$('#selbar').classList.add('hidden');
    const b=showModal(`<h3>📡 通信が切断されました</h3><p style="text-align:center">相手との接続が切れました。<br>タイトルにもどります。</p><div class="acts"><button class="abtn">タイトルへ</button></div>`,null);
    b.querySelector('button').onclick=()=>{closeModal();backToTitle();};
  }
}
function netReset(){
  const p=NET.peer,c=NET.conn;
  clearInterval(NET.hb);clearTimeout(NET.joinTimer);
  Object.assign(NET,{role:null,peer:null,conn:null,connected:false,lost:false,pend:{},rematch:[false,false],resultShown:false});
  try{c&&c.close();}catch(e){}try{p&&p.destroy();}catch(e){}
  showWait(false);
}
function backToTitle(){
  netReset();closeModal();
  if(G&&G.mode==='online'){G.over=true;}
  for(const id of ['#game','#result','#lobby'])$(id).classList.add('hidden');
  $('#title').classList.remove('hidden');$('#cover').classList.add('hidden');
}
function openLobby(role){
  netReset();NET.role=role;NET.side=role==='host'?0:1;
  $('#title').classList.add('hidden');$('#lobby').classList.remove('hidden');
  $('#lobbyHost').classList.toggle('hidden',role!=='host');$('#lobbyGuest').classList.toggle('hidden',role!=='guest');
  $('#lobbyTitle').textContent=role==='host'?'部屋を作る':'部屋に入る';
  $('#lobbyDeck').textContent='あなたのデッキ：'+(setup.deck[0]==='random'?'おまかせ':DECKS[setup.deck[0]].name);
  if(role==='host')hostCreate();
  else{netStatus('ホストから聞いた6文字のコードを入力してください');$('#btnJoinGo').disabled=false;$('#codeInput').value='';}
}
function shareText(){return `幻獣デュエルで対戦しよう！\n部屋コード：${NET.code}\n「オンライン対戦（2台）」→「部屋に入る」でコードを入力してね。`;}
async function copyCode(){
  const t=shareText();
  try{await navigator.clipboard.writeText(t);netStatus('コピーしました！相手に送ってください','ok');return;}catch(e){}
  const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');netStatus('コピーしました！相手に送ってください','ok');}catch(e){netStatus('コピーできませんでした。コードを直接伝えてください','err');}
  ta.remove();
}
async function shareCode(){
  if(navigator.share){try{await navigator.share({title:'幻獣デュエル',text:shareText()});return;}catch(e){if(e&&e.name==='AbortError')return;}}
  copyCode();
}
function requestRematch(){
  const e=$('#rematchMsg');if(e)e.textContent='相手の準備を待っています…';
  if(NET.role==='host'){NET.rematch[0]=true;checkRematch();}
  else netSend({k:'rematch'});
}
function checkRematch(){
  if(NET.rematch[0]&&NET.rematch[1]){NET.rematch=[false,false];startGame();return;}
  if(NET.rematch[1]){const e=$('#rematchMsg');if(e)e.textContent='相手が再戦を希望しています！';}
  if(NET.rematch[0])netSend({k:'rematchWait'});
}

/* ================= イベント ================= */
$('#btnHost').onclick=()=>openLobby('host');
$('#btnGuest').onclick=()=>openLobby('guest');
$('#btnJoinGo').onclick=guestJoin;
$('#codeInput').addEventListener('keydown',e=>{if(e.key==='Enter')guestJoin();});
$('#codeInput').addEventListener('input',e=>{e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);});
$('#btnCopy').onclick=copyCode;$('#btnShare').onclick=shareCode;
$('#btnLobbyBack').onclick=backToTitle;
renderSetup();
$('#btnStart').onclick=startGame;
$('#btnZukan').onclick=openZukan;
$('#btnRules').onclick=openRules;
$('#btnHelp').onclick=openRules;
$('#btnLog').onclick=()=>G&&openLog();
$('#ticker').onclick=()=>G&&openLog();
$('#selcancel').onclick=()=>finishSel(null);
$('#game').addEventListener('click',e=>{
  if(!G)return;
  const btn=e.target.closest('button');
  if(btn&&btn.id==='btnBattle'){goBattle();return;}
  if(btn&&btn.id==='btnEnd'){pEnd();return;}
  const z=e.target.closest('[data-zone]');if(!z)return;
  const side=+z.dataset.side,zone=z.dataset.zone,i=+z.dataset.i;
  if(G.sel){handleSel(side,zone,i);return;}
  if(zone==='gy'){openGY(side);return;}
  if(zone==='deck')return;
  openDetail(side,zone,i);
});
window.__game=()=>G;window.__net=NET;window.__cards=CARDS;window.__decks=DECKS;window.__setup=setup;

</script>
