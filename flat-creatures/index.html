<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffcf5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ふらっとクリーチャーズ</title>
<style>
:root{--bg:#fff7e6;--ink:#3a3355;--accent:#ff8a5c;--accent-d:#d9653a;--blue:#4fb3ff;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
html,body{margin:0;height:100%;background:#2b2540;font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic",Meiryo,sans-serif;color:var(--ink);overscroll-behavior:none;}
#app{max-width:480px;margin:0 auto;height:100%;height:100dvh;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column;}
.screen{display:none;flex:1;flex-direction:column;overflow-y:auto;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom));min-height:0;}
.screen.active{display:flex;}
button{font-family:inherit;font-weight:700;border:none;border-radius:16px;cursor:pointer;color:var(--ink);touch-action:manipulation;}
.btn{min-height:56px;font-size:18px;padding:12px 18px;background:var(--accent);color:#fff;box-shadow:0 5px 0 var(--accent-d);transition:transform .08s,box-shadow .08s;width:100%;}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accent-d);}
.btn.sub{background:#fff;color:var(--ink);box-shadow:0 5px 0 #d8cfc0;}
.btn.blue{background:var(--blue);box-shadow:0 5px 0 #2f86c9;}
.btn:disabled{opacity:.45;pointer-events:none;}
h2{margin:4px 0 10px;font-size:22px;}
.hint{font-size:14px;opacity:.75;margin:0 0 10px;}
.tchip{display:inline-block;font-size:11px;font-weight:700;color:#fff;padding:2px 7px;border-radius:999px;line-height:1.4;vertical-align:middle;text-shadow:0 1px 0 rgba(0,0,0,.2);}
/* title */
#s-title{align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 30%,#fff3c4,#ffd88a 60%,#ffb86b);}
.logo{font-size:40px;font-weight:900;line-height:1.1;color:#fff;text-shadow:0 4px 0 #ff7a45,0 8px 0 #c95a2f;letter-spacing:1px;margin:10px 0 4px;}
.logo small{display:block;font-size:22px;}
.parade{width:100%;overflow:hidden;margin:18px 0;height:96px;}
.parade-in{display:flex;gap:6px;width:max-content;animation:parade 28s linear infinite;}
.parade-in svg{width:88px;height:88px;}
@keyframes parade{to{transform:translateX(-50%);}}
.title-btns{width:100%;display:flex;flex-direction:column;gap:14px;margin-top:10px;}
.progress{margin-top:12px;font-size:14px;font-weight:700;}
/* team */
.detail{background:#fff;border-radius:18px;padding:10px;display:flex;gap:10px;align-items:center;box-shadow:0 3px 0 #eadfcb;margin-bottom:10px;min-height:150px;}
.detail svg{width:110px;height:110px;flex:none;}
.detail .dname{font-size:20px;font-weight:900;}
.statrow{display:flex;align-items:center;gap:6px;font-size:12px;margin:2px 0;}
.statrow b{width:60px;flex:none;white-space:nowrap;font-size:11px;}
.statbar{flex:1;height:8px;background:#eee;border-radius:9px;overflow:hidden;}
.statbar i{display:block;height:100%;border-radius:9px;}
.mvlist{display:grid;grid-template-columns:1fr 1fr;gap:3px 6px;margin-top:6px;font-size:12px;}
.mvlist span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mvlist .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:3px;vertical-align:middle;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-bottom:8px;}
.ccard{background:#fff;border-radius:16px;padding:6px 4px 8px;text-align:center;position:relative;box-shadow:0 3px 0 #eadfcb;border:3px solid transparent;transition:transform .1s;}
.ccard:active{transform:scale(.96);}
.ccard svg{width:100%;height:auto;aspect-ratio:1;display:block;}
.ccard .nm{font-size:13px;font-weight:900;margin:2px 0;}
.ccard.sel{border-color:var(--accent);background:#fff1ea;}
.ccard .num{position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-weight:900;font-size:15px;display:none;align-items:center;justify-content:center;}
.ccard.sel .num{display:flex;}
.ccard.dim{opacity:.4;}
.bottombar{position:sticky;bottom:-16px;background:linear-gradient(transparent,var(--bg) 25%);padding:16px 0 4px;display:flex;gap:10px;margin-top:auto;}
.bottombar .btn{flex:1;}
/* ladder */
.opp{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:12px;margin-bottom:12px;box-shadow:0 4px 0 #eadfcb;text-align:left;width:100%;min-height:84px;font-size:16px;}
.opp .av{width:60px;height:60px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;font-weight:900;}
.opp .info{flex:1;}
.opp .info small{display:block;font-weight:500;font-size:12px;opacity:.75;margin-top:2px;}
.opp.locked{opacity:.45;}
.badge{font-size:12px;padding:3px 8px;border-radius:999px;background:#ffe37a;}
.stars{color:#ff8a5c;letter-spacing:1px;font-size:13px;}
/* bring */
.opprow{display:flex;gap:4px;background:#fff;border-radius:16px;padding:8px;margin-bottom:12px;flex-wrap:wrap;justify-content:center;}
.opprow .mini{width:15%;text-align:center;font-size:10px;font-weight:700;}
.opprow .mini svg{width:100%;height:auto;aspect-ratio:1;display:block;}
/* battle */
#s-battle{padding:0;overflow:hidden;}
.field{position:relative;flex:1 1 auto;min-height:250px;background:linear-gradient(#aee2ff 0%,#e3f6ff 48%,#c7ecaa 48.5%,#9fd97f 100%);overflow:hidden;}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.85;}
.plat{position:absolute;border-radius:50%;background:#86c96a;box-shadow:inset 0 -6px 0 #6fb455;}
.plat.e{width:44%;height:9%;right:3%;top:42%;}
.plat.p{width:52%;height:10%;left:0;bottom:3%;}
.sp{position:absolute;}
.sp .inner{animation:bob 1.6s ease-in-out infinite;}
.sp svg{width:100%;height:auto;display:block;}
.sp.e{right:6%;top:9%;width:38%;}
.sp.p{left:2%;bottom:5%;width:46%;}
.sp.p svg{transform:scaleX(-1);}
@keyframes bob{50%{transform:translateY(-4px);}}
.sp.shake{animation:shake .5s;}
@keyframes shake{0%,100%{transform:translateX(0);opacity:1}15%{transform:translateX(-9px);opacity:.3}30%{transform:translateX(9px);opacity:1}45%{transform:translateX(-7px);opacity:.3}60%{transform:translateX(7px);opacity:1}80%{transform:translateX(-3px)}}
.sp.p.lunge{animation:lungeP .35s;}
.sp.e.lunge{animation:lungeE .35s;}
@keyframes lungeP{50%{transform:translate(22px,-16px) scale(1.05);}}
@keyframes lungeE{50%{transform:translate(-22px,16px) scale(1.05);}}
.sp.buff{animation:buff .6s;}
@keyframes buff{30%{transform:scale(1.1);filter:brightness(1.3) drop-shadow(0 0 10px #fff27a);}}
.sp.debuff{animation:debuff .6s;}
@keyframes debuff{30%{transform:scale(.92);filter:brightness(.7) drop-shadow(0 0 8px #7a8cff);}}
.sp.heal{animation:healA .7s;}
@keyframes healA{40%{filter:brightness(1.25) drop-shadow(0 0 12px #8fff9a);}}
.sp.faint{animation:faint .6s forwards;}
@keyframes faint{to{transform:translateY(50px) scale(.8);opacity:0;}}
.sp.pop{animation:pop .45s;}
@keyframes pop{0%{transform:scale(0);opacity:0}70%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
.sp.out{animation:outA .35s forwards;}
@keyframes outA{to{transform:scale(0);opacity:0}}
.sp.gone{opacity:0;}
.fx{position:absolute;pointer-events:none;font-size:30px;font-weight:900;animation:fxA .7s forwards;text-shadow:0 2px 0 #fff;}
@keyframes fxA{0%{transform:scale(.4);opacity:0}30%{transform:scale(1.2);opacity:1}100%{transform:scale(1) translateY(-20px);opacity:0}}
.hcard{position:absolute;background:rgba(255,255,255,.95);border-radius:14px;padding:7px 10px;box-shadow:0 3px 0 rgba(58,51,85,.18);width:54%;}
.hcard.e{left:8px;top:8px;}
.hcard.p{right:8px;bottom:10px;}
.hcard .row1{display:flex;align-items:center;gap:5px;font-weight:900;font-size:15px;}
.hcard .row1 .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hpbar{height:10px;background:#e3dfe9;border-radius:9px;overflow:hidden;margin-top:5px;position:relative;}
.hpbar i{position:absolute;left:0;top:0;bottom:0;border-radius:9px;transition:width .6s ease,background-color .3s;}
.hpnum{font-size:12px;font-weight:700;text-align:right;margin-top:2px;}
.stg{display:flex;gap:3px;flex-wrap:wrap;margin-top:3px;min-height:0;}
.stg span{font-size:10px;font-weight:700;padding:1px 5px;border-radius:6px;background:#ffe1d4;}
.stg span.dn{background:#d9e4ff;}
.balls{display:flex;gap:3px;}
.balls i{width:10px;height:10px;border-radius:50%;background:#ff8a5c;border:1.5px solid #fff;box-shadow:0 0 0 1px #c8b9a8;}
.balls i.x{background:#bbb;}
.turnlbl{position:absolute;right:8px;top:8px;font-size:11px;font-weight:700;background:rgba(255,255,255,.7);padding:2px 8px;border-radius:9px;}
.msg{flex:none;min-height:74px;background:#fff;border:3px solid var(--ink);border-radius:16px;margin:8px 8px 6px;padding:10px 14px;font-size:17px;font-weight:700;line-height:1.45;position:relative;}
.msg::after{content:"▼";position:absolute;right:10px;bottom:4px;font-size:11px;opacity:.5;animation:blink 1s infinite;}
.msg.idle::after{display:none;}
@keyframes blink{50%{opacity:0}}
.panel{flex:none;padding:0 8px calc(10px + env(safe-area-inset-bottom));min-height:206px;}
.moves{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.mbtn{min-height:72px;padding:6px 10px;text-align:left;border-radius:16px;color:#fff;position:relative;box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .08s;}
.mbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25);}
.mbtn .mn{font-size:16px;font-weight:900;text-shadow:0 1px 0 rgba(0,0,0,.25);display:block;}
.mbtn .ms{font-size:11px;font-weight:700;opacity:.95;display:block;margin-top:3px;}
.mbtn .tag{position:absolute;right:6px;top:6px;font-size:10px;background:#fff;color:#e8442e;padding:1px 6px;border-radius:8px;}
.mbtn .tag.weak{color:#6b7280;}
.prow{display:flex;gap:8px;margin-top:8px;}
.prow button{flex:1;min-height:52px;font-size:16px;background:#fff;border:3px solid var(--ink);border-radius:14px;}
.prow button.small{flex:none;width:60px;}
.swlist{display:flex;flex-direction:column;gap:7px;}
.swtitle{font-weight:900;font-size:14px;margin-bottom:2px;}
.swbtn{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:4px 10px;min-height:58px;text-align:left;}
.swbtn svg{width:48px;height:48px;flex:none;}
.swbtn .i{flex:1;font-size:15px;}
.swbtn .hpbar{height:8px;margin-top:3px;}
.swbtn:disabled{opacity:.4;}
.swbtn.cur{background:#fff4c9;}
/* result */
#s-result{align-items:center;justify-content:center;text-align:center;}
.rtitle{font-size:42px;font-weight:900;margin:6px 0;}
.rtitle.win{color:#ff8a5c;text-shadow:0 4px 0 #ffd28a;}
.rtitle.lose{color:#6c7aa8;}
.rteam{display:flex;justify-content:center;gap:4px;margin:12px 0;}
.rteam svg{width:96px;height:96px;}
.rbtns{width:100%;display:flex;flex-direction:column;gap:12px;margin-top:16px;}
/* modal */
.modal{position:absolute;inset:0;background:rgba(43,37,64,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:14px;}
.modal.show{display:flex;}
.mbox{background:#fff;border-radius:20px;padding:16px;width:100%;max-height:92%;overflow:auto;}
table.tc{border-collapse:collapse;width:100%;font-size:12px;text-align:center;}
table.tc td,table.tc th{border:1px solid #eee;padding:5px 2px;}
table.tc .s{background:#ffd9cc;color:#d33;font-weight:900;}
table.tc .w{background:#e3e8f5;color:#678;}
.confetti{position:absolute;top:-10px;width:10px;height:14px;border-radius:2px;animation:fall linear forwards;pointer-events:none;}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);}}
.tchip{font-size:10px;padding:2px 6px;margin-right:2px;}
.statrow b{width:60px;flex:none;white-space:nowrap;font-size:11px;}
.filters{display:flex;gap:5px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;flex:none;}
.filters::-webkit-scrollbar{display:none;}
.filters button{flex:none;min-height:36px;padding:4px 12px;border-radius:999px;font-size:13px;background:#fff;box-shadow:0 2px 0 #e3d8c4;}
.filters button.on{color:#fff;}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex:none;}
.tabs button{flex:1;background:#fff;border-radius:14px;padding:3px 2px 4px;position:relative;border:3px solid transparent;box-shadow:0 2px 0 #e3d8c4;}
.tabs button.on{border-color:var(--accent);background:#fff1ea;}
.tabs button svg{width:100%;height:auto;display:block;}
.tabs button small{display:block;font-size:10px;}
.tabs button.ng small{color:#e8442e;}
.mvhead{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:8px 12px;margin-bottom:8px;}
.mvhead svg{width:70px;height:70px;}
.mvrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border-radius:14px;padding:9px 12px;margin-bottom:8px;border:3px solid transparent;box-shadow:0 3px 0 #eadfcb;min-height:62px;}
.mvrow.sel{border-color:var(--accent);background:#fff1ea;}
.mvrow .ck{width:28px;height:28px;border-radius:50%;border:3px solid #d8cfc0;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;}
.mvrow.sel .ck{background:var(--accent);border-color:var(--accent);}
.mvrow .mi{flex:1;min-width:0;}
.mvrow .mi b{font-size:15px;}
.mvrow .mi small{display:block;font-size:11px;font-weight:500;opacity:.8;margin-top:2px;}
.dexrow{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:6px 10px;margin-bottom:7px;width:100%;text-align:left;box-shadow:0 3px 0 #eadfcb;}
.dexrow svg{width:62px;height:62px;flex:none;}
.dexrow .no{font-size:11px;opacity:.6;}
.dexrow .dn{font-size:16px;font-weight:900;}
.dexrow .ds{font-size:11px;font-weight:500;opacity:.8;}
.dexmv{display:flex;gap:6px;align-items:flex-start;font-size:12px;padding:6px 0;border-bottom:1px dashed #eee;}
.dexmv b{white-space:nowrap;}
.dexmv small{display:block;opacity:.75;}
.st{display:inline-block;font-size:10px;font-weight:900;color:#fff;padding:1px 6px;border-radius:6px;margin-left:3px;}
.wx{position:absolute;left:50%;top:8px;transform:translateX(-50%);font-size:12px;font-weight:900;background:rgba(255,255,255,.85);padding:3px 10px;border-radius:999px;display:none;z-index:2;white-space:nowrap;}
.field.sun{background:linear-gradient(#ffd98a 0%,#fff3d1 48%,#d6ecaa 48.5%,#b8de7f 100%);}
.field.rain{background:linear-gradient(#8fa6c2 0%,#c8d6e6 48%,#a9d3a0 48.5%,#86c27f 100%);}
.field.snow{background:linear-gradient(#cfe3f2 0%,#f2f8ff 48%,#eef6fb 48.5%,#d8e9f2 100%);}
.drop{position:absolute;top:-20px;width:2px;height:14px;background:rgba(255,255,255,.8);animation:rainA .7s linear infinite;pointer-events:none;}
.flake{position:absolute;top:-10px;width:6px;height:6px;border-radius:50%;background:#fff;animation:snowA 3s linear infinite;pointer-events:none;}
@keyframes rainA{to{transform:translateY(420px) translateX(-30px);}}
@keyframes snowA{to{transform:translateY(420px) translateX(20px);}}
.sp.protect svg{filter:drop-shadow(0 0 8px #7fd4ff) drop-shadow(0 0 3px #fff);}
.mbtn .ms{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.hcard .row1 .tchip{font-size:9px;padding:1px 5px;}
.bb3 .btn{font-size:15px;padding:8px;}

.abban{position:absolute;left:8px;z-index:5;background:linear-gradient(90deg,#3a3355,#5a4d9a);color:#fff;font-weight:900;font-size:15px;padding:6px 14px 6px 12px;border-radius:0 14px 14px 0;box-shadow:0 3px 0 rgba(0,0,0,.25);animation:abIn .3s ease-out;border-left:5px solid #ffd34d;}
.abban small{display:block;font-size:10px;opacity:.85;font-weight:700;}
.abban.e{top:96px;} .abban.p{bottom:120px;left:auto;right:8px;border-radius:14px 0 0 14px;border-left:none;border-right:5px solid #ffd34d;}
.abban.bye{opacity:0;transition:opacity .3s;}
@keyframes abIn{from{transform:translateX(-30px);opacity:0}}
.abban.p{animation-name:abInR;} @keyframes abInR{from{transform:translateX(30px);opacity:0}}
.abl{font-size:10px;font-weight:700;color:#7a6cff;margin-top:1px;}
.stg span.ex{background:#e6dcff;} .stg span.hz{background:#ffe9a8;}
.sp.subst svg{opacity:.45;filter:grayscale(.4);}
.field.trick::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(160,120,255,.10) 0 14px,transparent 14px 28px);pointer-events:none;}
#mvabil .abt{font-weight:900;font-size:14px;margin:2px 0 6px;}
.abopt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:#fff;border-radius:14px;padding:8px 12px;margin-bottom:6px;border:3px solid transparent;box-shadow:0 3px 0 #eadfcb;}
.abopt b{color:#5a4d9a;font-size:15px;} .abopt small{display:block;font-size:11px;font-weight:500;opacity:.8;margin-top:2px;}
.abopt.sel{border-color:#7a6cff;background:#f1eeff;}
.abopt .ck{width:26px;height:26px;border-radius:50%;border:3px solid #d8cfc0;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;}
.abopt.sel .ck{background:#7a6cff;border-color:#7a6cff;}
.abrow{background:#fff;border-radius:14px;padding:9px 12px;margin-bottom:7px;box-shadow:0 3px 0 #eadfcb;}
.abrow b{color:#5a4d9a;font-size:15px;} .abrow small{display:block;font-size:12px;margin-top:2px;}
.abh{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px;} .abh span{font-size:10px;background:#f3eee4;border-radius:6px;padding:1px 6px;font-weight:700;}
.evoline{display:flex;align-items:center;justify-content:center;gap:2px;background:#fff7e6;border-radius:12px;padding:4px;margin-top:6px;font-size:11px;font-weight:700;text-align:center;}
.evoline .ev{flex:1;max-width:96px;border-radius:10px;padding:2px;} .evoline .ev.cur{background:#ffe1d4;} .evoline .arr{font-size:16px;}

.seencnt{margin-top:8px;font-size:13px;font-weight:700;background:#fff;border-radius:999px;padding:4px 14px;display:inline-block;box-shadow:0 2px 0 #eadfcb;}.seencnt b{color:#ff5f9e;font-size:16px;}
.seen{font-size:9px;background:#e6f7e6;color:#3a8a3a;border-radius:6px;padding:0 5px;}

.btn.green{background:#3fbf7f;box-shadow:0 5px 0 #2a8f5c;color:#fff;}
.onlcard{background:#fff;border-radius:16px;padding:10px 12px;margin-bottom:10px;box-shadow:0 3px 0 #eadfcb;}
.onlh{font-weight:900;font-size:14px;margin-bottom:6px;}
.onlinput{width:100%;font-size:18px;font-weight:700;padding:10px 12px;border-radius:12px;border:3px solid #eadfcb;background:#fffaf0;font-family:inherit;box-sizing:border-box;}
.onlinput.code{letter-spacing:6px;text-align:center;font-size:22px;}
.onlteam{display:flex;gap:2px;} .onlteam div{flex:1;}
.roomcode{font-size:52px;font-weight:900;letter-spacing:10px;color:#ff7a45;font-family:ui-monospace,monospace;margin:4px 0;}
.onllink{font-size:11px;word-break:break-all;background:#f3eee4;border-radius:8px;padding:6px;margin-top:8px;}
.onlwait{text-align:center;font-weight:700;padding:12px;}
.onlnote{color:#e8442e;font-weight:700;font-size:13px;min-height:4px;margin-bottom:4px;}
.dots{display:inline-block;width:14px;height:14px;border-radius:50%;border:3px solid #ff8a5c;border-right-color:transparent;animation:spin 1s linear infinite;vertical-align:-2px;}
@keyframes spin{to{transform:rotate(360deg)}}
.otimer{display:none;position:absolute;right:8px;top:50%;transform:translateY(-50%);background:rgba(58,51,85,.85);color:#fff;font-weight:900;font-size:14px;padding:4px 10px;border-radius:999px;z-index:4;}
.otimer.hurry{background:#e8442e;}
.sndbtn{position:absolute;z-index:6;width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,.85);box-shadow:0 2px 0 rgba(0,0,0,.15);font-size:19px;line-height:40px;padding:0;cursor:pointer;}
.sndbtn.t{top:calc(10px + env(safe-area-inset-top));right:12px;} .sndbtn.f{left:8px;top:50%;transform:translateY(-50%);width:34px;height:34px;font-size:16px;line-height:34px;}

</section>

<section id="s-moves" class="screen">

</section>

<section id="s-dex" class="screen">

<section id="s-abil" class="screen">

</section>

<section id="s-ladder" class="screen">

<script>

const FAST = /fast/.test(location.search);
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, FAST ? Math.min(ms, 15) : ms));
const rnd = n => Math.floor(Math.random() * n);

const TABB = {'ノーマル':'ノ','炎':'炎','水':'水','草':'草','電気':'電','岩':'岩','風':'風','氷':'氷','毒':'毒','エスパー':'エ','闇':'闇','妖精':'妖'};
const EFF = {
  'ノーマル':{'岩':0.5},
  '炎':{'草':2,'氷':2,'水':0.5,'岩':0.5,'炎':0.5},
  '水':{'炎':2,'岩':2,'草':0.5,'水':0.5},
  '草':{'水':2,'岩':2,'炎':0.5,'草':0.5,'風':0.5,'毒':0.5},

  '岩':{'炎':2,'電気':2,'風':2,'氷':2,'岩':0.5},
  '風':{'草':2,'電気':2,'毒':2,'岩':0.5},
  '氷':{'草':2,'風':2,'炎':0.5,'水':0.5,'氷':0.5},

};
const eff1 = (a, d) => { const v = EFF[a] && EFF[a][d]; return v === undefined ? 1 : v; };
const effM = (a, types) => types.reduce((x, t) => x * eff1(a, t), 1);
const chip = t => `<span class="tchip" style="background:${TYPES[t]}">${t}</span>`;
const chips = ts => ts.map(chip).join('');

const SN = {brn:'やけど',par:'まひ',psn:'どく',slp:'ねむり',frz:'こおり'};

/* ===== わざ (80) ===== */
const MOVES = {

  ice1:{n:'つららショット',t:'氷',p:65,st:['frz',10]},
  ice2:{n:'ブリザードドーン',t:'氷',p:105,a:75,st:['frz',20],snowacc:1},
  iceshard:{n:'ひょうけつダッシュ',t:'氷',p:40,pr:1},
  snow:{n:'ゆきげしょう',t:'氷',weather:'snow'},
  frost:{n:'しもふりガード',t:'氷',self:{def:1},target:{spe:-1}},
  icicle:{n:'つらられんだ',t:'氷',p:25,hits:[2,5]},
  // 毒
  psn1:{n:'どくどくスライム',t:'毒',p:65,st:['psn',30]},
  psn2:{n:'どろどろウェーブ',t:'毒',p:95,a:90,st:['psn',30]},
  toxic:{n:'もうどくミスト',t:'毒',a:90,inflict:'psn'},
  needles:{n:'どくばりれんしゃ',t:'毒',p:20,hits:[2,5],st:['psn',20]},
  net:{n:'ねばねばネット',t:'毒',target:{spe:-2}},

  psy1:{n:'ミラクルビーム',t:'エスパー',p:65,fl:10},

Object.keys(MOVES).forEach(k => { const m = MOVES[k]; m.k = k; m.p = m.p || 0; m.a = m.a || 100; });

function stageText(obj, who){
  return Object.keys(obj).map(k => `${who}${STATL[k]}${obj[k] > 0 ? '+' : ''}${obj[k]}`).join('・');
}
const XDESC = {rockhaz:'あいての ばに とがった いしを まく（こうたいで ダメージ）',psnhaz:'あいての ばに どくびしを まく（こうたいで どく）',trick:'5ターン おそい じゅんに うごく ばに する',taunt:'3ターン あいては へんかわざが つかえない',sub:'HP1/4で みがわりを つくる',drum:'HPはんぶんで こうげき さいだいまで アップ',painsplit:'おたがいの HPを わけあう',yawn:'つぎの ターンの おわりに あいてを ねむらせる',roar:'あいてを むりやり こうたいさせる（さいご）',healbell:'みかたの じょうたいいじょうを ぜんぶ なおす'};
function describe(m, short){
  const P = [];
  if (XDESC[m.k]) P.push(XDESC[m.k]);
  if (m.p > 0){
    if (m.half) P.push('あいての HPを はんぶんに');
    else if (!short && m.p > 1) P.push('いりょく' + m.p);
    if (m.hits) P.push(m.hits[0] === m.hits[1] ? m.hits[0] + 'かい こうげき' : m.hits[0] + '〜' + m.hits[1] + 'かい こうげき');
    if (m.a < 100 && !short) P.push('めいちゅう' + m.a);
    if (m.pr) P.push(m.pr > 0 ? 'せんせい' : 'さいごに うごく');
    if (m.fake) P.push('でた ターンだけ・かならず ひるむ');
    if (m.crit) P.push('きゅうしょに あたりやすい');
    if (m.recoil) P.push('はんどう あり');
    if (m.drain) P.push('HPを すいとる');
    if (m.pivot) P.push('こうげき後 こうたい');
    if (m.st) P.push(m.st[1] + '%で ' + SN[m.st[0]]);
    if (m.fl) P.push(m.fl + '%で ひるむ');
    if (m.sec) P.push(m.sc + '%で ' + stageText(m.sec, 'あいて'));
    if (m.selfsec) P.push((m.ssc && m.ssc < 100 ? m.ssc + '%で ' : '') + stageText(m.selfsec, 'じぶん'));
    if (m.snowacc && !short) P.push('ゆきの とき かならず あたる');
  } else {
    if (m.inflict) P.push('あいてを ' + SN[m.inflict] + 'に する');
    if (m.self) P.push(stageText(m.self, 'じぶん'));
    if (m.target) P.push(stageText(m.target, 'あいて'));
    if (m.heal) P.push('HPを ' + (m.heal >= 0.5 ? 'はんぶん' : 'すこし') + ' かいふく');
    if (m.sunheal && !short) P.push('はれで もっと かいふく');
    if (m.cure) P.push('じょうたいいじょうも なおす');
    if (m.rest) P.push('HP ぜんかいふく＋2ターン ねむる');
    if (m.protect) P.push('その ターンの こうげきを ふせぐ（せんせい）');
    if (m.weather) P.push('5ターン ' + WN[m.weather] + 'に する');
    if (m.a < 100 && !short) P.push('めいちゅう' + m.a);
  }
  return P.join('・');
}
const WDESC = {sun:'炎わざ 1.5ばい／水わざ はんぶん', rain:'水わざ 1.5ばい／炎わざ はんぶん', snow:'氷タイプいがい まいターン ダメージ／氷の ぼうぎょ アップ'};

/* ===== クリーチャー (32) ===== */
const R = (id,name,types,color,acc,shape,feat,eyes,mouth,hp,atk,def,spe,pool,desc) => ({id,name,types,color,acc,shape,feat,eyes,mouth,hp,atk,def,spe,pool,desc});
const BASE = [

function shade(hex, f){
  let n = parseInt(hex.slice(1),16), r=n>>16, g=(n>>8)&255, b=n&255;
  const m = v => Math.round(f<0 ? v*(1+f) : v+(255-v)*f);
  return '#'+[m(r),m(g),m(b)].map(v=>v.toString(16).padStart(2,'0')).join('');
}

  let feet = s.feet ? `<ellipse cx="45" cy="${s.feet}" rx="9" ry="5" fill="${D}"/><ellipse cx="75" cy="${s.feet}" rx="9" ry="5" fill="${D}"/>` : '';
  if (ov.claws && s.feet) feet = [45,75].map(x=>`<ellipse cx="${x}" cy="${s.feet}" rx="11" ry="6" fill="${D}"/><path d="M${x-7} ${s.feet+3} l-2 6 l4 -3 M${x} ${s.feet+4} l0 6 l2 -4 M${x+7} ${s.feet+3} l2 6 l-4 -3" fill="#fff" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/>`).join('');

const STATUS_PRI = ['perish','skillswap','sleeppow','lullaby','rockhaz','yawn','psnhaz','drum','shellsmash','taunt','trick','sub','twave','willo','toxic','plot','focus','dance','charge','recharge','wish','heal','spring','mirror','rest','protect','frost','wink','scare','tickle','glare','net','guard','tailwind'];
function autoMoves(c){
  if(c.cpu) return c.cpu.slice();
  const atk = c.pool.filter(k => MOVES[k].p > 0);
  const val = k => { const m = MOVES[k]; let h = m.hits ? (m.hits[0]===m.hits[1]?m.hits[0]:3.1) : 1;
    if (m.needsleep) return 0;
    return (m.half?70:(m.gyro||m.reversal)?60:m.wpow?80:m.hex?m.p*1.3:m.p*h) * (c.types.includes(m.t)?1.5:1) * m.a/100 - (m.recoil?15:0) + (m.pr?12:0) + (m.pivot?8:0) + (m.fake?20:0) + (m.st?6:0); };
  atk.sort((a,b) => val(b) - val(a));
  const out = [];
  const stab = atk.find(k => c.types.includes(MOVES[k].t)); if (stab) out.push(stab);
  const cov = atk.find(k => !out.includes(k) && !out.some(o => MOVES[o].t === MOVES[k].t)); if (cov) out.push(cov);
  const st = STATUS_PRI.find(k => c.pool.includes(k)); if (st) out.push(st);
  atk.forEach(k => { if (out.length < 4 && !out.includes(k)) out.push(k); });
  c.pool.forEach(k => { if (out.length < 4 && !out.includes(k)) out.push(k); });
  return out.slice(0,4);
}

let B = null;
let RNG = Math.random;
const RR = () => RNG();
const rr = n => Math.floor(RR()*n);
function mkRng(seed){ let a=seed>>>0; const f=()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; f.get=()=>a; f.set=v=>{a=v>>>0;}; return f; }
function mkMon(id, moves, ab, mult=1){
  const c=byId(id), hp=Math.round(c.hp*mult);
  return {id, c, name:c.name, types:c.types.slice(), maxhp:hp, hp, atk:Math.round(c.atk*mult), def:Math.round(c.def*mult), spe:Math.round(c.spe*mult),
    moves:moves.map(k=>MOVES[k]), ab, st:{atk:0,def:0,spe:0}, status:null, slpT:0, protect:false, pchain:0, flinch:false, out:0, sub:0, taunt:0, yawn:0, ffire:false,
    loaf:false, dbond:false, encore:0, encMove:null, perish:0, endure:false, unb:false, dmgTaken:0, lastMove:null, orig:null, disp:null};
}
const stageMul = s => s>=0 ? (2+s)/2 : 2/(2-s);
const act = side => B[side].team[B[side].a];
const other = side => side==='p' ? 'e' : 'p';
const pre = side => side==='e' ? 'あいての ' : '';
const alive = side => B[side].team.filter(m=>m.hp>0).length;
const benchAlive = side => B[side].team.some((m,i)=>i!==B[side].a && m.hp>0);
const hasAb = (m, k) => m.ab === k;
function spd(m){
  let s=m.spe*stageMul(m.st.spe)*(m.status==='par'?0.5:1); const w=B.weather.k;
  if((w==='sun'&&hasAb(m,'chlorophyll'))||(w==='rain'&&hasAb(m,'swiftswim'))||(w==='snow'&&hasAb(m,'slushrush'))) s*=2;
  if(hasAb(m,'slowstart') && m.out<5) s*=0.5;
  if(hasAb(m,'unburden') && m.unb) s*=2;
  if(hasAb(m,'weatherking') && w) s*=1.5;
  return s;
}
const immune = (m, s) => (s==='brn'&&m.types.includes('炎'))||(s==='par'&&m.types.includes('電気'))||(s==='psn'&&m.types.includes('毒'))||(s==='frz'&&m.types.includes('氷'));
const abStatusBlock = (m, s) => (s==='slp'&&hasAb(m,'insomnia'))||(s==='par'&&hasAb(m,'limber'))||(s==='psn'&&hasAb(m,'immunity'))||((s==='brn'||s==='frz')&&hasAb(m,'waterveil'));
const statusImmune = (m, s) => immune(m,s) || abStatusBlock(m,s);
const TYPE_IMM = {waterabsorb:'水', voltabsorb:'電気', flashfire:'炎', sapsipper:'草'};
function abImmune(d, mv, t){
  if(TYPE_IMM[d.ab] && TYPE_IMM[d.ab]===t && (mv.p>0 || mv.inflict || mv.target)) return d.ab;
  if(d.ab==='levitate' && t==='岩' && mv.p>0) return d.ab;
  return null;
}
const isStatusMove = mv => !mv.p;
const prOf = (m, mv) => (mv.pr||0) + (hasAb(m,'prankster') && isStatusMove(mv) ? 1 : 0);

function cpuBring(opp, playerTeam){
  const ids = opp.team.slice();
  if(opp.lvl===0) return ids.slice(0,3);
  const score = id => {const c=byId(id); let s=0;
    playerTeam.forEach(p=>{const pt=byId(p).types;
      if(c.types.some(t=>effM(t,pt)>1)) s+=2;
      if(pt.some(t=>effM(t,c.types)>1)) s-=2;
      if(pt.every(t=>effM(t,c.types)<1)) s+=1;});
    return s + (c.hp+c.atk+c.def+c.spe)/200 + Math.random()*(opp.lvl===2?0.6:2);};
  return ids.sort((a,b)=>score(b)-score(a)).slice(0,3);
}
function cpuAbil(id, lvl){ const a=byId(id).abil; return lvl===1 ? a[rnd(a.length)] : a[0]; }

async function startBattle(ids, opp){
  markSeen(ids.concat(opp.team));
  B = {p:{team:ids.map(id=>mkMon(id,getMoves(id),getAbil(id))),a:0,haz:{rock:false,psn:false}},
       e:{team:cpuBring(opp, save.team).map(id=>mkMon(id, opp.lvl===0?defMoves(id):autoMoves(byId(id)), cpuAbil(id,opp.lvl), opp.mult)),a:0,haz:{rock:false,psn:false}},
       opp, turn:1, busy:true, lastSwitch:-9, waiter:null, over:false, weather:{k:null,n:0}, trick:0, acted:new Set(), abLog:[], hs:'p', online:false};
  RNG = Math.random;
  window.__FC.abLog = B.abLog;
  show('battle');
  $('#sp-e').className='sp e gone'; $('#sp-p').className='sp p gone';
  $('#hc-e').style.visibility='hidden'; $('#hc-p').style.visibility='hidden';
  renderWeather(); setPanel('none');
  await say(`${opp.name}が しょうぶを しかけてきた！`);
  await say(`「${opp.intro}」`);
  await sendOut('e'); await sendOut('p');
  const first = spd(act('p'))>=spd(act('e')) ? ['p','e'] : ['e','p'];
  for(const s of first) await entry(s);
  nextCommand();
}

function anim(side, cls, ms){

async function setHP(side, target){
  const m=act(side), from=m.hp; target=Math.max(0,Math.min(m.maxhp,Math.round(target)));
  m.hp=target;
  const el=$('#hc-'+side), bar=el.querySelector('.hpbar i'), r=target/m.maxhp;
  bar.style.width=(r*100)+'%'; bar.style.backgroundColor=hpColor(r);
  const num=el.querySelector('.hpv'), pct=el.querySelector('.hpnum');
  const dur=FAST?10:550, t0=performance.now();
  await new Promise(res=>{ let done=false; const fin=()=>{ if(!done){done=true;res();} };
    const step=now=>{ const k=Math.min(1,(now-t0)/dur), v=Math.round(from+(target-from)*k);
      if(num) num.textContent=v; else if(pct) pct.textContent=Math.ceil(v/m.maxhp*100)+'%';
      k<1 ? requestAnimationFrame(step) : fin(); }; requestAnimationFrame(step); setTimeout(fin, dur+100); });
  if(hasAb(m,'unburden') && !m.unb && m.hp>0 && m.hp<=m.maxhp/2 && act(side)===m){ m.unb=true; await banner(side,'unburden'); renderCard(side); await say(`${pre(side)}${m.name}は みがるに なって すばやさが あがった！`, 800); }
}

/* --- 交代 --- */
async function sendOut(side){
  const m=act(side); m.out=0; m.protect=false; m.flinch=false; m.pchain=0;
  renderSprite(side); renderCard(side);
  if(side==='e') await say(`${B.opp.name}は ${m.name}を くりだした！`, 300);
  else await say(`いけっ！ ${m.name}！`, 300);
  await anim(side,'pop',450);
  await sleep(300);
}
async function entry(side){
  const m=act(side), hz=B[side].haz;
  if(m.hp<=0) return;
  if(hz.rock && !hasAb(m,'levitate') && !hasAb(m,'magicguard')){
    await setHP(side, m.hp-Math.max(1,Math.floor(m.maxhp*effM('岩',m.types)/8)));
    await say(`${pre(side)}${m.name}に とがった いしが ささった！`, 800);
    if(m.hp<=0){ await faint(side); return; }
  }
  if(hz.psn){
    if(m.types.includes('毒')){ hz.psn=false; renderCard(side); await say(`${pre(side)}${m.name}が どくびしを かたづけた！`, 800); }
    else if(!m.status && !statusImmune(m,'psn') && !hasAb(m,'levitate')){ m.status='psn'; renderCard(side); await say(`${pre(side)}${m.name}は どくびしで どくを あびた！`, 800); }
  }
  const fs=other(side), foe=act(fs);
  if(m.ab==='celebrate'){ await banner(side,'celebrate'); await applyStages(side,{atk:1,spe:1},false); }
  if(m.ab==='imposter' && foe.hp>0 && !m.orig){
    await banner(side,'imposter');
    m.orig={types:m.types, atk:m.atk, def:m.def, spe:m.spe, moves:m.moves};
    m.types=foe.types.slice(); m.atk=foe.atk; m.def=foe.def; m.spe=foe.spe; m.moves=foe.moves.slice(); m.st=Object.assign({},foe.st); m.disp=foe.disp||foe.c;
    await anim(side,'out',250); renderSprite(side); renderCard(side); await anim(side,'pop',350);
    await say(`${pre(side)}${m.name}は ${foe.name}に へんしんした！`, 900);
  }
  if(m.ab==='intimidate' && foe.hp>0){ await banner(side,'intimidate'); await applyStages(fs,{atk:-1},true); }
  if(m.ab==='slowstart'){ await banner(side,'slowstart'); await say(`${pre(side)}${m.name}は ちょうしが でない…`, 800); }
  if(m.ab==='allyfaint'){ const n=B[side].team.filter(x=>x!==m && x.hp<=0).length; if(n){ await banner(side,'allyfaint'); await applyStages(side,{atk:n},false); } }
  const w={suncall:'sun',raincall:'rain',snowcall:'snow'}[m.ab];
  if(w && B.weather.k!==w){ await banner(side,m.ab); B.weather={k:w,n:5}; renderWeather(); await say(WSTART[w], 800); }
}
async function doSwitch(side, to, mode, baton){ // 'faint' | 'switch' | 'pivot' | 'forced'
  const cur=act(side), keep = baton ? Object.assign({}, cur.st) : null;
  if(mode!=='faint' && cur.hp>0){
    if(mode==='pivot') await say(`${pre(side)}${cur.name}は もどっていった！`, 500);
    else if(mode==='forced') await say(`${pre(side)}${cur.name}は ふきとばされた！`, 600);
    else await say(side==='p' ? `もどれ、${cur.name}！` : `${B.opp.name}は ${cur.name}を ひっこめた！`, 500);
    if(hasAb(cur,'natcure') && cur.status){ await banner(side,'natcure'); cur.status=null; }
    if(hasAb(cur,'regen') && cur.hp<cur.maxhp){ await banner(side,'regen'); cur.hp=Math.min(cur.maxhp, cur.hp+Math.floor(cur.maxhp/3)); renderCard(side); }
    await anim(side,'out',350);
  }
  if(cur.orig){ Object.assign(cur, {atk:cur.orig.atk, def:cur.orig.def, spe:cur.orig.spe, moves:cur.orig.moves}); cur.orig=null; cur.disp=null; }
  Object.assign(cur,{st:{atk:0,def:0,spe:0}, sub:0, taunt:0, yawn:0, ffire:false, types:cur.c.types.slice(), loaf:false, dbond:false, encore:0, encMove:null, perish:0, endure:false});
  B[side].a=to;
  if(keep) act(side).st=keep;
  await sendOut(side);
  if(keep && Object.values(keep).some(v=>v)){ renderCard(side); await say(`${pre(side)}${act(side).name}は のうりょくの へんかを ひきついだ！`, 800); }
  await entry(side);
}
async function chooseSwitch(side, mode){
  if(!B.online) return side==='p' ? await askPlayerSwitch(mode) : aiReplace();
  if(side==='p'){
    let to;
    if(B.pre!=null){ to=B.pre; B.pre=null; }
    else { to = await askPlayerSwitch(mode); NET.send({t:'sw', to}); }
    return to;
  }
  idleMsg('あいての こうどうを まっています…');
  const msg = await NET.next('sw');
  return validSwitch('e', msg.to);
}
function validSwitch(side, to){
  const T=B[side].team;
  if(Number.isInteger(to) && to>=0 && to<T.length && to!==B[side].a && T[to].hp>0) return to;
  const o=T.findIndex((m,i)=>i!==B[side].a && m.hp>0); return o<0 ? B[side].a : o;
}
async function askPlayerSwitch(mode){
  idleMsg(mode==='force' ? 'つぎは だれを だす？' : 'だれと こうたいする？');
  setPanel(mode);
  if(B.online) startTimer(()=>{ if(B.waiter) B.waiter(validSwitch('p',-1)); });
  const to = await new Promise(res=>B.waiter=res);
  B.waiter=null; setPanel('none'); if(B.online) stopTimer();
  return to;
}

function weatherMul(t){
  const w=B.weather.k;
  if(w==='sun') return t==='炎'?1.5:t==='水'?0.5:1;
  if(w==='rain') return t==='水'?1.5:t==='炎'?0.5:1;

    if(tg.encore>0 || !tg.lastMove || tg.lastMove.encore || !tg.moves.includes(tg.lastMove)) return fail();
    tg.encore=3; tg.encMove=tg.lastMove; renderCard(ts); await say(`${pre(ts)}${tg.name}は アンコールを うけた！（${tg.encMove.n}しか だせない）`);
  }
  if(mv.invert){
    if(!Object.values(foe.st).some(v=>v)) return fail();
    for(const k in foe.st) foe.st[k]=-foe.st[k]; await anim(fs,'debuff',400); renderCard(fs); await say(`${pre(fs)}${foe.name}の のうりょくへんかが ひっくりかえった！`);
  }
  if(mv.spdswap){ const x=me.spe; me.spe=foe.spe; foe.spe=x; renderCard(side); renderCard(fs); await say('おたがいの すばやさを いれかえた！'); }
  if(mv.skillswap){
    if(me.ab===foe.ab || me.ab==='wonderguard' || foe.ab==='wonderguard') return fail();
    const x=me.ab; me.ab=foe.ab; foe.ab=x; me.loaf=false; foe.loaf=false; renderCard(side); renderCard(fs);
    await say(`とくせいを いれかえた！ ${pre(side)}${me.name}は ${ABIL[me.ab].n}、${pre(fs)}${foe.name}は ${ABIL[foe.ab].n}に なった！`, 1100);
  }
  if(mv.strdrain){
    const amt=Math.floor(foe.atk*stageMul(foe.st.atk)*0.6);
    if(me.hp<me.maxhp){ anim(side,'heal',500); await setHP(side, me.hp+amt); await say(`${pre(side)}${me.name}は あいての ちからを すいとった！`, 800); }
    await applyStages(fs,{atk:-1},true);
  }
  if(mv.heal){
    let f=mv.heal;
    if(mv.sunheal){ if(B.weather.k==='sun') f=2/3; else if(B.weather.k) f=0.25; }
    if(mv.cure && me.status){ me.status=null; renderCard(side); await say(`${pre(side)}${me.name}の じょうたいが なおった！`, 800); }
    if(me.hp>=me.maxhp){ if(!mv.self) await say('しかし HPは まんたんだ！'); }
    else { anim(side,'heal',650); await setHP(side, me.hp+me.maxhp*f); await say(`${pre(side)}${me.name}は ぽかぽか げんきに なった！`); }
  }
  if(mv.rest){
    if(me.hp>=me.maxhp){ await say('しかし HPは まんたんだ！'); return; }
    if(hasAb(me,'insomnia')){ await banner(side,'insomnia'); return fail(); }
    me.status='slp'; me.slpT=3; renderCard(side); anim(side,'heal',650);
    await setHP(side, me.maxhp); await say(`${pre(side)}${me.name}は ぐっすり ねむって げんきに なった！`);
  }
  if(mv.taunt){ if(tg.taunt>0) return fail(); tg.taunt=3; renderCard(ts); await say(`${pre(ts)}${tg.name}は ちょうはつに のってしまった！`); }
  if(mv.yawn){ if(tg.status||tg.yawn||statusImmune(tg,'slp')) return fail(); tg.yawn=2; renderCard(ts); await say(`${pre(ts)}${tg.name}は ねむけを さそわれた…`); }
  if(mv.split){ const avg=Math.floor((me.hp+foe.hp)/2); await setHP(side, avg); await setHP(fs, avg); await say('おたがいの HPを わけあった！'); }
  if(mv.roar){
    const opts=B[fs].team.map((m,i)=>i).filter(i=>i!==B[fs].a && B[fs].team[i].hp>0);
    if(!opts.length) return fail();
    await doSwitch(fs, opts[rr(opts.length)], 'forced'); return;
  }
  if(mv.pivot && benchAlive(side) && me.hp>0) await doPivot(side, mv.baton);
  else if(mv.baton && !benchAlive(side)) await fail();
}
async function dbondCheck(side, foe){
  const me=act(side);
  if(foe.dbond && me.hp>0){ foe.dbond=false; await say(`${foe.name}は ${pre(side)}${me.name}を みちづれに した！`, 900); await setHP(side, 0); }
}
async function koBoost(side){
  const me=act(side); if(me.hp<=0) return;
  if(hasAb(me,'moxie')){ await banner(side,'moxie'); await applyStages(side,{atk:1},false); }
  if(hasAb(me,'beastboost')){ const k=['atk','def','spe'].sort((x,y)=>me[y]-me[x])[0]; await banner(side,'beastboost'); await applyStages(side,{[k]:1},false); }
}

/* --- ターン --- */
function nextCommand(){
  B.busy=false;
  idleMsg(`${act('p').name}は どうする？`);
  setPanel('moves');
  if(B.online) onlineTurnStart();
}
async function onPlayer(action){
  if(B.busy || B.over) return;
  B.busy=true; setPanel('none');
  if(B.online) return onlineAct(action);
  const cpu=aiChoose();
  await runTurn(action, cpu);
}
async function runTurn(pa, ea){
  B.acted = new Set();
  ['p','e'].forEach(s=>B[s].team.forEach(m=>{ m.dmgTaken=0; }));
  const acts=[Object.assign({side:'p'},pa), Object.assign({side:'e'},ea)];
  if(B.hs==='e') acts.reverse();
  for(const a of acts) if(a.kind==='switch'){ await doSwitch(a.side, a.to, 'switch'); if(a.side==='e') B.lastSwitch=B.turn; }
  const mv = acts.filter(a=>a.kind==='move').map(a=>{ const mon=act(a.side); let m=mon.moves[a.idx]||mon.moves[0];
    if(mon.encore>0 && mon.encMove && mon.moves.includes(mon.encMove)) m=mon.encMove;
    return Object.assign(a,{mon, mv:m}); });
  mv.forEach(a=>{ a.pr=prOf(a.mon,a.mv); a.sp=spd(a.mon); a.tie=RR(); });
  mv.sort((x,y)=> (y.pr-x.pr) || (B.trick>0 ? x.sp-y.sp : y.sp-x.sp) || (x.tie-y.tie));
  for(const a of mv){
    if(act(a.side)!==a.mon || a.mon.hp<=0) continue;
    await tryMove(a.side, a.mv);
    if(alive('p')===0 || alive('e')===0) break;
  }
  await endOfTurn();
}
async function hpTick(s, frac, text){ const m=act(s); await setHP(s, m.hp+m.maxhp*frac); await say(text, 750); if(m.hp<=0) await faint(s); }
async function residual(){
  const order=[B.hs, other(B.hs)].sort((x,y)=>spd(act(y))-spd(act(x)));
  const w=B.weather.k;
  for(const s of order){ const m=act(s); if(m.hp<=0) continue;
    const P=pre(s)+m.name;
    if(w==='snow' && !m.types.includes('氷') && !hasAb(m,'icebody') && !hasAb(m,'magicguard')) await hpTick(s,-1/16,`${P}は ゆきで ひえて ダメージ！`);
    if(m.hp<=0) continue;
    if(w==='snow' && hasAb(m,'icebody') && m.hp<m.maxhp){ await banner(s,'icebody'); await hpTick(s,1/16,`${P}は ゆきで げんきに なった！`); }
    if(w==='rain' && hasAb(m,'raindish') && m.hp<m.maxhp){ await banner(s,'raindish'); await hpTick(s,1/16,`${P}は あめで げんきに なった！`); }
    if(w==='sun' && hasAb(m,'solarpower')){ await banner(s,'solarpower'); await hpTick(s,-1/8,`${P}は ひざしで HPが へった！`); }
  }
  if(w){ B.weather.n--; if(B.weather.n<=0){ B.weather={k:null,n:0}; renderWeather(); await say(WEND[w], 800); } else renderWeather(); }
  if(B.trick>0){ B.trick--; renderWeather(); if(!B.trick) await say('ゆがんだ じくうが もとに もどった！', 800); }
  for(const s of order){ const m=act(s); if(m.hp<=0) continue;
    const P=pre(s)+m.name;
    if(m.status==='psn' && hasAb(m,'poisonheal')){ if(m.hp<m.maxhp){ await banner(s,'poisonheal'); await hpTick(s,1/8,`${P}は どくで げんきに なった！`); } }
    else if((m.status==='brn'||m.status==='psn') && !hasAb(m,'magicguard')){ anim(s,'shake',400); await hpTick(s,-(m.status==='brn'?1/16:1/8),`${P}は ${m.status==='brn'?'やけど':'どく'}の ダメージを うけた！`); }
    if(m.hp<=0) continue;
    if(m.status && hasAb(m,'shedskin') && RR()<0.3){ await banner(s,'shedskin'); m.status=null; renderCard(s); await say(`${P}の じょうたいが なおった！`, 700); }
    if(m.yawn>0){ m.yawn--; if(m.yawn===0) await inflict(s,'slp',true); else renderCard(s); }
    if(m.taunt>0){ m.taunt--; if(!m.taunt) await say(`${P}の ちょうはつが とけた！`, 600); renderCard(s); }
    if(hasAb(m,'speedboost') && m.st.spe<6 && m.out>=0){ await banner(s,'speedboost'); await applyStages(s,{spe:1},false); }
    if(m.encore>0){ m.encore--; if(!m.encore){ m.encMove=null; await say(`${P}の アンコールが とけた！`, 600); } renderCard(s); }
    if(hasAb(m,'moody')){ const ks=['atk','def','spe'], up=ks.filter(k=>m.st[k]<6);
      if(up.length){ const u=up[rr(up.length)], dn=ks.filter(k=>k!==u && m.st[k]>-6); await banner(s,'moody'); await applyStages(s,{[u]:2},false); if(dn.length) await applyStages(s,{[dn[rr(dn.length)]]:-1},false); } }
    if(m.perish>0){ m.perish--; renderCard(s);
      if(m.perish===0){ await say(`${P}は ほろびのメロディで たおれた！`, 800); await setHP(s,0); await faint(s); continue; }
      await say(`${P}の ほろびカウント ${m.perish}`, 600); }
  }
  ['p','e'].forEach(s=>{ const m=act(s); m.protect=false; m.endure=false; m.flinch=false; m.out++; $('#sp-'+s).classList.remove('protect'); });
}
async function endOfTurn(){
  if(alive('p')>0 && alive('e')>0) await residual();
  for(let guard=0; guard<12; guard++){
    if(alive('p')===0) return finish(false);
    if(alive('e')===0) return finish(true);
    let ch=false;
    if(B.online && act('p').hp<=0 && B.pre==null){ const to = await askPlayerSwitch('force'); NET.send({t:'sw', to}); B.pre=to; }
    for(const s of [other(B.hs), B.hs]){
      if(act(s).hp<=0 && alive(s)>0){ const to = await chooseSwitch(s,'force'); await doSwitch(s, to, 'faint'); ch=true; }
    }
    if(!ch) break;
  }
  if(alive('p')===0) return finish(false);
  if(alive('e')===0) return finish(true);
  B.turn++;
  nextCommand();
}

/* --- CPU AI --- */
function threatOn(att, def){ let t=0; att.moves.forEach(m=>{ t=Math.max(t, est(att,def,m)); }); return t; }
const threatPct = (att, def) => threatOn(att,def)/Math.max(1,def.hp);
function matchup(me, foe){ return Math.min(1.2,threatPct(me,foe)) - Math.min(1.2,threatPct(foe,me)) + (spd(me)>spd(foe)?0.15:0); }
function moveScore(me, foe, mv, lvl){
  const r=me.hp/me.maxhp, fr=foe.hp/foe.maxhp;
  if(me.taunt>0 && isStatusMove(mv)) return -100;
  if(mv.counter){
    if(me.lastMove && me.lastMove.counter && !me.dmgTaken) return -15;
    if(foe.lastMove && (isStatusMove(foe.lastMove) || foe.lastMove.counter) && Math.random()<0.6) return -5;
    return (spd(me)<spd(foe) || mv.pr<0) && threatOn(foe,me)<me.hp*0.9 && threatOn(foe,me)>foe.hp*0.25/mv.counter ? 52 : -10;
  }
  if(mv.p>0){
    if(mv.fake && me.out>0) return -50;
    const d=est(me,foe,mv);
    if(d<=0) return lvl>=1 ? -40 : -5;
    let s=Math.min(d,foe.hp)/foe.maxhp*100;
    if(foe.sub>0 && !hasAb(me,'infiltrator')) s*=0.6;
    if(d>=foe.hp) s+= lvl>=2 ? 100 : 40;
    if(prOf(me,mv)>0 && d>=foe.hp) s+=60;
    if(mv.fake) s+=40;
    if(mv.drain) s+=Math.min(d*mv.drain, me.maxhp-me.hp)/me.maxhp*40;
    if(mv.recoil && !hasAb(me,'rockhead') && !hasAb(me,'magicguard')) s-=Math.min(d,foe.hp)*mv.recoil/me.hp*50;
    if(mv.pivot && lvl>=1 && matchup(me,foe)<-0.2 && benchAlive('e')) s+=22;
    if(mv.st && !foe.status && !statusImmune(foe,mv.st[0]) && !hasAb(me,'sheer')) s+=mv.st[1]*0.15;
    if(mv.fl && spd(me)>spd(foe)) s+=mv.fl*0.15;
    if(lvl>=1 && effM(moveType(mv),foe.types)>1) s+=8;
    if(mv.selfsec) s+= Object.values(mv.selfsec).reduce((a,v)=>a+v,0)*(hasAb(me,'contrary')?-1:1)>0 ? 10 : (d>=foe.hp?0:-10);
    if(mv.selfko) s-= (d>=foe.hp?20:60) + (alive('e')<=1?100:0);
    if(mv.spin && (B.e.haz.rock||B.e.haz.psn)) s+=30;
    if(mv.clear) s+=Object.values(foe.st).reduce((a,v)=>a+Math.max(0,v),0)*15;
    return s;
  }
  const t=moveType(mv);
  const targeted = mv.target || mv.inflict || mv.taunt || mv.yawn || mv.split || mv.encore || mv.strdrain || mv.skillswap || mv.invert;
  if(targeted && abImmune(foe,mv,t)) return -30;
  if((mv.target||mv.inflict||mv.taunt||mv.yawn||mv.encore) && hasAb(foe,'magicbounce')) return -30;
  const posSt = m => Object.values(m.st).reduce((a,v)=>a+Math.max(0,v),0);
  if(mv.endure) return me.pchain>0 ? -10 : (me.moves.some(m=>m.reversal||m.endeavor) && r>0.5 && threatOn(foe,me)>=me.hp ? 45 : 2);
  if(mv.dbond) return (me.dbond || me.pchain>0) ? -10 : (threatOn(foe,me)>=me.hp && spd(me)>spd(foe) && r<0.6 ? 62 : (r<0.3 ? 30 : -5));
  if(mv.perish) return (foe.perish||me.perish) ? -20 : ((posSt(foe)>=2 || hasAb(foe,'wonderguard')) && benchAlive('e')) ? 55 : (alive('e')>alive('p') ? 32 : 4);
  if(mv.encore) return (!foe.encore && foe.lastMove && isStatusMove(foe.lastMove) && !foe.lastMove.encore) ? 50 : -10;
  if(mv.invert) return posSt(foe)>=2 ? 52 : -10;
  if(mv.spdswap) return (foe.spe>me.spe*1.25) ? 34 : -10;
  if(mv.skillswap) return (['truant','slowstart','defeatist'].includes(me.ab) && !['truant','wonderguard'].includes(foe.ab)) ? 64 : -10;
  if(mv.strdrain) return (r<0.7 ? 40 : 12) + (foe.atk>=110 ? 10 : 0) - (foe.st.atk<=-3 ? 25 : 0);
  if(mv.baton) return (posSt(me)>=2 && benchAlive('e')) ? 46 : -10;
  if(me.perish===1 && benchAlive('e')) return -5;
  if(targeted && foe.sub>0 && !hasAb(me,'infiltrator')) return -20;
  if(mv.protect) return me.pchain>0 ? -10 : ((foe.status==='psn'||foe.status==='brn'||foe.yawn||(B.weather.k==='snow'&&!foe.types.includes('氷'))) ? 30 : 5);
  if(mv.weather){
    if(B.weather.k===mv.weather) return -10;
    const tt={sun:'炎',rain:'水',snow:'氷'}[mv.weather];
    const cnt=B.e.team.filter(m=>m.hp>0 && m.types.includes(tt)).length;
    return r>0.5 ? (cnt>=2?42:cnt?28:5) : 5;
  }
  if(mv.inflict){
    if(foe.status || statusImmune(foe,mv.inflict) || fr<0.3) return -10;
    const base = {slp:62, par: spd(foe)>spd(me)?52:34, brn: foe.atk>=100?52:36, psn: foe.maxhp>=170?46:36}[mv.inflict];
    return base*mv.a/100 + (lvl>=2?8:0);
  }
  if(mv.hazard){ const n=B.p.team.filter((m,i)=>m.hp>0 && i!==B.p.a).length; return (!B.p.haz[mv.hazard] && n>0 && lvl>=1) ? 34+n*4 : -10; }
  if(mv.trick) return B.trick>0 ? (spd(me)>spd(foe) ? 20 : -20) : (spd(me)<spd(foe) ? 40 : -10);
  if(mv.taunt) return foe.taunt>0 ? -10 : (foe.moves.filter(isStatusMove).length>=2 ? 34 : 6);
  if(mv.sub) return me.sub>0 || r<0.5 ? -10 : 22;
  if(mv.yawn) return (foe.status||foe.yawn||statusImmune(foe,'slp')) ? -10 : 40;
  if(mv.drum) return (r>0.65 && me.st.atk<2 && threatOn(foe,me) < me.hp*0.4) ? 50 : -10;
  if(mv.split) return (foe.hp-me.hp > me.maxhp*0.3) ? 50 : -10;
  if(mv.roar) return (Object.values(foe.st).reduce((a,v)=>a+Math.max(0,v),0)>=2 || ((B.p.haz.rock||B.p.haz.psn) && benchAlive('p'))) ? 38 : 2;
  if(mv.healbell) return B.e.team.some(m=>m.hp>0&&m.status) ? 35 : -10;
  if(mv.rest) return hasAb(me,'insomnia') ? -20 : me.status&&r<0.6 ? 48 : (r<0.4 ? 56 : -10);
  let s=0;
  if(mv.heal && !mv.self && !(mv.cure && me.status) && r>=1) return -10;
  if(mv.heal) s += r<0.45 ? 72 : r<0.7 ? 28 : 0;
  if(mv.cure && me.status) s += 28;
  if(mv.self){
    if(hasAb(me,'contrary') && Object.values(mv.self).reduce((a,v)=>a+v,0)>0) return -20;
    const keys=Object.keys(mv.self).filter(k=>mv.self[k]>0);
    const cur=keys.reduce((a,k)=>a+Math.max(0,me.st[k]),0);
    const danger = lvl>=2 && threatOn(foe,me)>=me.hp;
    s += danger ? 0 : r>0.6 ? Math.max(0,46-cur*20) : 6;
  }
  if(mv.target){
    if(hasAb(foe,'clearbody')||hasAb(foe,'competitive')) return -15;
    const k=Object.keys(mv.target)[0]; s += foe.st[k]>-2 && r>0.5 ? 28 : 4;
    if(mv.pivot && matchup(me,foe)<0 && benchAlive('e')) s+=18;
  }
  return s;
}
function aiChoose(){
  const me=act('e'), foe=act('p'), lvl=B.opp.lvl;
  if(lvl===0){
    if(Math.random()<0.35){ const sc=me.moves.map(m=>moveScore(me,foe,m,0)); return {kind:'move', idx:sc.indexOf(Math.max(...sc))}; }
    return {kind:'move', idx:rnd(me.moves.length)};
  }
  const bench=B.e.team.map((m,i)=>({m,i})).filter(o=>o.i!==B.e.a && o.m.hp>0);
  if(bench.length && me.perish===1) return {kind:'switch', to:bench.map(o=>({i:o.i,s:matchup(o.m,foe)})).sort((a,b)=>b.s-a.s)[0].i};
  if(bench.length && B.turn-B.lastSwitch>1 && me.status!=='slp'){
    const curM=matchup(me,foe);
    const best=bench.map(o=>({i:o.i, s:matchup(o.m,foe)-threatPct(foe,o.m)*0.5 + (hasAb(o.m,'intimidate')?0.1:0) - (B.e.haz.rock?0.1:0)})).sort((a,b)=>b.s-a.s)[0];
    const iCanKO = me.moves.some(m=>est(me,foe,m)>=foe.hp) && spd(me)>spd(foe);
    if(!iCanKO && best.s>curM+0.45 && Math.random()<(lvl>=2?0.6:0.25)) return {kind:'switch', to:best.i};
  }
  const noise = lvl>=2 ? 6 : 22;
  const sc=me.moves.map(m=>moveScore(me,foe,m,lvl)+Math.random()*noise);
  return {kind:'move', idx:sc.indexOf(Math.max(...sc))};
}
function aiReplace(){
  const foe=act('p');
  const opts=B.e.team.map((m,i)=>({m,i})).filter(o=>o.m.hp>0 && o.i!==B.e.a);
  if(!opts.length) return B.e.a;
  if(B.opp.lvl===0) return opts[0].i;
  return opts.map(o=>({i:o.i, s:matchup(o.m,foe)+Math.random()*(B.opp.lvl>=2?0.05:0.4)})).sort((a,b)=>b.s-a.s)[0].i;
}

/* --- パネル --- */
function setPanel(mode){
  const p=$('#panel');
  if(mode==='none'){ p.innerHTML=''; return; }
  if(mode==='moves'){
    const me=act('p'), foe=act('e');
    p.innerHTML = `<div class="moves">${me.moves.map((m,i)=>{
      const t=moveType(m), e=m.p&&!m.half?effM(t,foe.types):1;
      let tag = m.p&&!m.half ? (e===0?'<span class="tag weak">こうかなし</span>':e>1?'<span class="tag">ばつぐん</span>':e<1?'<span class="tag weak">いまひとつ</span>':'') : '';
      if(abImmune(foe,m,t)) tag='<span class="tag weak">とくせいで むこう</span>';
      if(me.taunt>0 && isStatusMove(m)) tag='<span class="tag weak">ちょうはつ中</span>';
      if(m.p && !m.half && hasAb(foe,'wonderguard') && e<=1) tag='<span class="tag weak">とくせいで むこう</span>';
      if(me.encore>0 && me.encMove && m!==me.encMove) tag='<span class="tag weak">アンコール中</span>';
      const sub = m.p ? `${t}・${m.half?'HPはんぶん':(m.gyro||m.reversal||m.counter||m.endeavor||m.stored||m.spout||m.avenge)?'いりょく へんどう':'いりょく'+m.p}${describe(m,true)&&!m.half?'・'+describe(m,true):''}` : `${m.t}・${describe(m,true)}`;
      return `<button class="mbtn" data-i="${i}" style="background:${TYPES[t]}">${tag}<span class="mn">${m.n}</span><span class="ms">${sub}</span></button>`;
    }).join('')}</div>

/* ===== オンラインたいせん（P2P / WebRTC） ===== */
const PROTO = 'fc-online-1';
const PEER_PREFIX = 'flatcr-v1-';
const ICE = {iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};
const QS = new URLSearchParams(location.search);
const OTIME = +(QS.get('otime')) || 60;
const ABORT = 'ABORT';
const sleepReal = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NET = {peer:null, conn:null, host:false, code:'', q:{}, w:{}, last:0, hb:null, phase:'idle',
  myTeam:null, oppTeam:null, oppName:'ともだち', myPick:null, oppPick:null, gotHello:false, rm:{me:false,them:false}, desync:0, pendingJoin:null};
NET.send = o => { try { if (NET.conn && NET.conn.open) NET.conn.send(o); } catch(e){} };
NET.next = type => new Promise((res, rej) => {
  const q = NET.q[type] || (NET.q[type] = []);
  if (q.length) return res(q.shift());
  NET.w[type] = {res, rej};
});
NET.abortAll = () => { Object.keys(NET.w).forEach(k => { const w = NET.w[k]; delete NET.w[k]; w.rej(ABORT); }); };
NET.resetQ = () => { NET.abortAll(); NET.q = {}; };
function enqueue(d){
  const w = NET.w[d.t];
  if (w){ delete NET.w[d.t]; w.res(d); } else (NET.q[d.t] || (NET.q[d.t] = [])).push(d);
}

/* --- チームの けんさ（ふせいデータで おちないように） --- */
function myTeamPayload(){ return save.team.map(id => ({id, m:getMoves(id), a:getAbil(id)})); }
function validateTeam(t){
  if (!Array.isArray(t) || t.length !== 6) return null;
  const seen = new Set(), out = [];
  for (const x of t){
    if (!x || typeof x.id !== 'string') return null;
    const c = byId(x.id); if (!c || seen.has(x.id)) return null; seen.add(x.id);
    if (!Array.isArray(x.m) || x.m.length < 1 || x.m.length > 4) return null;
    const ms = [...new Set(x.m)]; if (ms.length !== x.m.length || ms.some(k => typeof k !== 'string' || !c.pool.includes(k) || !MOVES[k])) return null;
    if (typeof x.a !== 'string' || !c.abil.includes(x.a)) return null;
    out.push({id:x.id, m:ms, a:x.a});
  }
  return out;
}
const validPick = p => Array.isArray(p) && p.length === 3 && new Set(p).size === 3 && p.every(i => Number.isInteger(i) && i >= 0 && i < 6);
function validAct(side, a){
  if (a && a.kind === 'switch'){ const T = B[side].team, to = a.to;
    if (Number.isInteger(to) && to >= 0 && to < T.length && to !== B[side].a && T[to].hp > 0) return {kind:'switch', to}; }
  if (a && a.kind === 'move' && Number.isInteger(a.idx) && a.idx >= 0 && a.idx < act(side).moves.length) return {kind:'move', idx:a.idx};
  return {kind:'move', idx:0};
}

function leaveOnline(note){
  NET.phase = 'idle';
  clearInterval(NET.hb); NET.hb = null;
  NET.resetQ();
  try { if (NET.conn) NET.conn.close(); } catch(e){}
  try { if (NET.peer) NET.peer.destroy(); } catch(e){}
  NET.conn = null; NET.peer = null; NET.gotHello = false;
  renderOnlineMenu(note);
}
function peerErr(e){
  const t = e && e.type;
  if (t === 'unavailable-id' && NET.host && NET.phase === 'hosting'){ try { NET.peer.destroy(); } catch(_){} return hostRoom(); }
  if (t === 'peer-unavailable') return leaveOnline('へやが みつかりませんでした。コードを たしかめてね');
  if (NET.phase === 'battle') return;
  leaveOnline(t === 'network' || t === 'server-error' || t === 'socket-error' || t === 'socket-closed' ? 'サーバーに つながりません。インターネットを たしかめてね' : 'つうしんエラー（' + esc(t || e) + '）');
}
function newPeer(id){
  if (typeof Peer === 'undefined') throw new Error('no peer');
  const p = id ? new Peer(id, {config:ICE, debug:0}) : new Peer({config:ICE, debug:0});
  p.on('error', peerErr);
  p.on('disconnected', () => { if (NET.peer === p && (NET.phase === 'hosting')) try { p.reconnect(); } catch(e){} });
  return p;
}
function hostRoom(){
  NET.host = true; NET.code = String(10000 + Math.floor(Math.random() * 90000)); NET.phase = 'hosting';
  $('#onl').innerHTML = '<div class="onlwait"><span class="dots"></span> へやを つくっています…</div>'; onlMsg('');
  try { NET.peer = newPeer(PEER_PREFIX + NET.code); } catch(e){ return leaveOnline('オンライン きのうが つかえません'); }
  NET.peer.on('open', () => { if (NET.phase === 'hosting') renderHosting(); });
  NET.peer.on('connection', c => {
    if (NET.conn && NET.conn.open){ c.on('open', () => { c.send({t:'error', msg:'busy'}); setTimeout(() => c.close(), 500); }); return; }
    setupConn(c);
  });
}
function joinRoom(code){
  NET.host = false; NET.code = code; NET.phase = 'joining';
  $('#onl').innerHTML = `<div class="onlwait"><span class="dots"></span> へや ${esc(code)} に せつぞく中…</div>`; onlMsg('');
  try { NET.peer = newPeer(null); } catch(e){ return leaveOnline('オンライン きのうが つかえません'); }
  NET.peer.on('open', () => setupConn(NET.peer.connect(PEER_PREFIX + code, {reliable:true, serialization:'json'})));
  setTimeout(() => { if (NET.phase === 'joining') leaveOnline('せつぞく できませんでした。コードと インターネットを たしかめてね'); }, 20000);
}
function setupConn(c){
  NET.conn = c;
  c.on('open', () => {
    NET.phase = 'hello'; NET.last = Date.now(); NET.resetQ();
    NET.myTeam = myTeamPayload();
    c.send({t:'hello', v:PROTO, name:save.name || 'プレイヤー', team:NET.myTeam});
    clearInterval(NET.hb);
    NET.hb = setInterval(() => {
      NET.send({t:'ping'});
      if (Date.now() - NET.last > 20000) onDisconnect();
    }, 2000);
  });
  c.on('data', onData);
  c.on('close', onDisconnect);
  c.on('error', onDisconnect);
}
function onDisconnect(){
  if (NET.phase === 'idle') return;
  const wasBattle = NET.phase === 'battle';
  clearInterval(NET.hb); NET.hb = null;
  if (wasBattle && B && B.online && !B.over){ NET.phase = 'over'; endOnline(null, 'dc'); }
  else if (NET.phase === 'over'){ NET.phase = 'over-dc'; const b = $('#r-rematch'); if (b){ b.disabled = true; b.textContent = 'あいてが いなくなりました'; } }
  else if (NET.phase !== 'over-dc'){ show('online'); leaveOnline('あいてとの つうしんが きれました'); return; }
  try { if (NET.peer) NET.peer.destroy(); } catch(e){}
}
function onData(d){
  NET.last = Date.now();
  if (!d || typeof d !== 'object' || typeof d.t !== 'string') return;
  switch (d.t){
    case 'ping': return;
    case 'hello': {
      if (d.v !== PROTO){ NET.send({t:'error', msg:'version'}); return setTimeout(() => leaveOnline('ゲームの バージョンが ちがいます。おなじ ファイル／リンクで あそんでね'), 300); }
      const t = validateTeam(d.team);
      if (!t){ NET.send({t:'error', msg:'team'}); return setTimeout(() => leaveOnline('あいての チームデータが ただしく ありません'), 300); }
      NET.oppTeam = t; NET.oppName = String(d.name || 'ともだち').slice(0, 8); NET.gotHello = true;
      markSeen(t.map(x => x.id));
      return openPick();
    }
    case 'error':
      return leaveOnline(d.msg === 'version' ? 'ゲームの バージョンが ちがいます' : d.msg === 'busy' ? 'その へやは もう たいせん中です' : d.msg === 'team' ? 'チームデータが ただしく ないと いわれました' : 'エラーが おきました');
    case 'pick':
      if (!validPick(d.p)) return;
      NET.oppPick = d.p; updatePickWait(); return maybeStart();
    case 'start':
      if (NET.host || !Number.isInteger(d.seed)) return;
      return startOnline(d.seed);
    case 'surrender':
      if (B && B.online && !B.over) endOnline(true, 'surr_them'); return;
    case 'rematch':
      NET.rm.them = true; updateRematch(); return;
    case 'bye':
      return onDisconnect();
    default:
      if (['act','sw','hash','sync'].includes(d.t)) enqueue(d);
  }
}

/* --- オンライン バトル --- */
async function startOnline(seed){
